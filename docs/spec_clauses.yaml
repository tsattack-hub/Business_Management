# =============================================================================
# 구매규격서 조항 라이브러리
# -----------------------------------------------------------------------------
# 규격서를 조항 단위로 쪼개어 모아 둔 것. 새 사업의 품목을 고르면
# 해당하는 조항만 골라 조립한다.
#
# 조항 출처(source)
#   표준   — 법령·계약예규에서 온 것. 그대로 써도 안전하다
#   관행   — 공공 발주에서 통용되는 문구. 사업에 맞는지 확인 필요
#   수집   — 나라장터 사전규격에서 추출한 것. ★ 반드시 검토 후 사용
#
# ★ 수집 조항 주의
#   다른 기관 규격서에는 그 기관 사정에 맞춘 조건이 섞여 있다.
#   특정 제조사 모델, 그 기관만의 인증 요구, 지역 조건 등을 그대로 옮기면
#   우리 사업에서는 부당한 입찰 제한이 되고 감사 지적 사유가 된다 (AUD-013).
#
# 치환자는 서류 틀과 같다.  {사업명} {공항} {추정가격} {이행기간} ...
# 사람이 정해야 하는 값은 [[ ... ]] 로 남긴다. 생성기가 빈칸으로 표시한다.
# =============================================================================

schema_version: "kac.specclause.v1"

# -----------------------------------------------------------------------------
# 품목군 — 새 사업에서 하나를 고른다
# -----------------------------------------------------------------------------
품목군:

  - id: CCTV
    명칭: 영상감시장치 (CCTV)
    별칭: [영상감시, IP카메라, 폐쇄회로텔레비전, 네트워크카메라, NVR]
    조항: [SPEC-CCTV-01, SPEC-CCTV-02, SPEC-CCTV-03, SPEC-CCTV-04]
    규격항목:
      - {key: 해상도,       단위: 화소,  힌트: "예) 200만 화소 이상", 필수: true}
      - {key: 프레임,       단위: fps,   힌트: "예) 30fps 이상 @최대해상도", 필수: true}
      - {key: 저장기간,     단위: 일,    힌트: "예) 30일 이상 (전 채널 동시녹화 기준)", 필수: true}
      - {key: 압축방식,     단위: "",    힌트: "예) H.265 지원", 필수: true}
      - {key: 카메라수량,   단위: 대,    힌트: "고정형/PTZ 구분하여 기재", 필수: true}
      - {key: 동작온도,     단위: ℃,     힌트: "예) -30 ~ +50 (옥외 설치분)", 필수: false}
      - {key: 방진방수,     단위: "",    힌트: "예) IP66 이상 (옥외 설치분)", 필수: false}
    필수확인:
      - "개인정보보호법 제25조 — 설치 전 행정예고 20일"
      - "공공기관용 보안성능 인증제품 여부 확인 (현행 요구 버전은 항행시설실 확인)"

  - id: NETWORK
    명칭: 통신·네트워크 장비
    별칭: [스위치, 라우터, L2, L3, 광전송장비, 백본]
    조항: [SPEC-NET-01, SPEC-NET-02, SPEC-NET-03]
    규격항목:
      - {key: 포트구성,     단위: "",    힌트: "예) 1G 24포트 + 10G 업링크 4포트", 필수: true}
      - {key: 스위칭용량,   단위: Gbps,  힌트: "예) 128Gbps 이상", 필수: true}
      - {key: 이중화,       단위: "",    힌트: "예) 전원 이중화, 링 프로토콜 지원", 필수: true}
      - {key: 관리방식,     단위: "",    힌트: "예) SNMP v3, 콘솔, 웹", 필수: false}
    필수확인:
      - "정보통신제품 도입 시 사이버보안팀 보안성 적합성 검증"
      - "국가정보원 보안적합성 검증 대상 여부 확인"

  - id: POWER
    명칭: 전원설비 (UPS·정류기)
    별칭: [무정전전원공급장치, UPS, 정류기, 축전지]
    조항: [SPEC-PWR-01, SPEC-PWR-02, SPEC-PWR-03]
    규격항목:
      - {key: 정격용량,     단위: kVA,   힌트: "예) 100kVA", 필수: true}
      - {key: 백업시간,     단위: 분,    힌트: "예) 정격부하 30분 이상", 필수: true}
      - {key: 입출력,       단위: "",    힌트: "예) 3상 4선식 380V", 필수: true}
      - {key: 효율,         단위: "%",   힌트: "예) 정격부하 95% 이상", 필수: false}
    필수확인:
      - "★ 시험성적서 지적 사례가 나온 품목입니다. 제출물 조항을 특히 정확히 쓰십시오."

  - id: GENERAL
    명칭: 기타 (품목군 미지정)
    별칭: []
    조항: []
    규격항목:
      - {key: 주요규격, 단위: "", 힌트: "핵심 성능·용량을 기재", 필수: true}
    필수확인: []

# -----------------------------------------------------------------------------
# 공통 조항 — 품목과 무관하게 모든 규격서에 들어간다
# -----------------------------------------------------------------------------
공통조항:

  # ---------------- 1. 일반사항 ----------------
  - id: GEN-01
    절: 1
    유형: 일반사항
    제목: 적용범위
    출처: 표준
    본문: |
      본 규격서는 「{사업명}」에 사용되는 물품의 구매 및 설치에 적용한다.
      본 규격서에 명시되지 않은 사항은 관련 법령, 한국산업표준(KS),
      관계 기관의 기준 및 발주기관의 지시에 따른다.

  - id: GEN-02
    절: 1
    유형: 일반사항
    제목: 관련 규격 및 기준
    출처: 표준
    본문: |
      본 물품은 다음 규격 및 기준에 적합하여야 한다.
      가. 한국산업표준(KS)
      나. 정보통신공사업법 및 관련 고시
      다. 전기설비기술기준 및 판단기준
      라. 산업안전보건법 및 관련 기준
      마. [[ 사업 특성상 추가로 적용할 규격 ]]

  - id: GEN-03
    절: 1
    유형: 일반사항
    제목: 사업 개요
    출처: 표준
    본문: |
      가. 사 업 명 : {사업명}
      나. 설치장소 : {공항}
      다. 추정가격 : {추정가격} (부가가치세 별도)
      라. 이행기간 : 계약일로부터 {이행기간}일
      마. 사업내용 : [[ 물품 구매 및 설치 범위를 한두 문장으로 ]]

  - id: GEN-04
    절: 1
    유형: 일반사항
    제목: 규격의 해석
    출처: 관행
    본문: |
      가. 본 규격서에 기재된 규격은 최소 요구조건이며, 이를 상회하는
          성능의 물품 납품은 허용한다.
      나. 규격서와 도면의 내용이 상이한 경우 계약담당자와 협의하여 결정한다.
      다. 본 규격서에 명기된 규격은 특정 제조사의 제품을 지정하는 것이 아니며,
          동등 이상의 성능을 갖춘 제품이면 납품할 수 있다.
    비고: "다항은 특정회사 규격 명기 지적(AUD-013)에 대한 완충 문구이지만, 이것만으로 면책되지 않는다. 실제 규격에서 상표·모델을 빼는 것이 우선이다."

  # ---------------- 2. 특기시방 (품목별 조항이 여기에 삽입된다) ----------------

  # ---------------- 3. 제출물 ----------------
  - id: SUB-01
    절: 3
    유형: 제출물
    제목: 착수 시 제출물
    출처: 표준
    본문: |
      계약상대자는 계약 체결 후 [[ 7 ]]일 이내에 다음을 제출하여야 한다.
      가. 사업수행계획서 1부
      나. 예정공정표 (제작 → 납품 → 설치 → 시험) 1부
      다. 현장대리인 선임계 및 경력증명서 1부
      라. 주요기자재 공급원 승인신청서 1부
      마. 보안각서 (대표자 및 참여자) 각 1부

  - id: SUB-02
    절: 3
    유형: 제출물
    제목: 시험성적서
    출처: 표준
    필수: true
    본문: |
      계약상대자는 검사 시 다음 요건을 모두 충족하는 시험성적서를 제출하여야 한다.
      가. 시험 대상 : 본 계약으로 납품하는 물품과 동일한 모델 및 규격
      나. 발급 기관 : 「국가표준기본법」에 따른 KOLAS 인정기관 또는
                      관계 법령에 따른 공인시험기관
      다. 발급 시기 : 본 계약 체결일 이후 발급된 것
      라. 시험 항목 : [[ 규격서 2절에 명시한 성능 항목 ]]
      ※ 형식승인·인증 취득 과정에서 발급된 성적서는 위 요건을 충족하지 않는 한
        본 조의 제출물로 인정하지 아니한다.
    비고: |
      ★ 감사 지적 원문 — 규격서는 공인기관시험성적서를 요구했으나
      계약 이전 NEP 인증용으로 제작사가 다른 기관에 의뢰해 받은 성적서를 제출받음.
      위 네 요건(대상·기관·시기·항목)을 모두 적어야 이 지적을 막을 수 있다.
    검증룰: [AUD-002, AUD-041]

  - id: SUB-03
    절: 3
    유형: 제출물
    제목: 준공 시 제출물
    출처: 표준
    본문: |
      가. 준공신고서 및 준공내역서 1부
      나. 준공도면 (CAD 원본 및 출력본) 각 1부
      다. 시험성적서 및 측정표 (절연저항, 접지저항) 1부
      라. 취급설명서 및 유지보수 매뉴얼 (국문) 1부
      마. 준공사진 (설치 전 · 중 · 후) 1부
      바. 부속품 및 예비품 목록 1부
      사. [[ 설치작업 포함 시 ]] 산업안전보건관리비 사용내역서 1부
    비고: "바항의 예비품 목록은 준공 후 부외 예비품 전산 등재의 근거가 된다 (AUD-004)."

  # ---------------- 4. 검사 및 검수 ----------------
  - id: INS-01
    절: 4
    유형: 검사검수
    제목: 검사
    출처: 표준
    본문: |
      가. 발주기관이 지정한 검사자가 납품 물품의 규격·성능·수량이
          본 규격서 및 계약조건과 일치하는지 검사한다.
      나. 검사 시 계약상대자는 입회하여야 하며, 시험에 필요한 계측기와
          인력을 부담한다.
      다. 검사 결과 불합격 시 계약상대자의 부담으로 교체 또는 보완한 후
          재검사를 받아야 한다.

  - id: INS-02
    절: 4
    유형: 검사검수
    제목: 검수
    출처: 표준
    본문: |
      검사에 합격한 물품에 대하여 발주기관이 지정한 검수자가 손상·훼손 여부와
      계약서 및 납품서류상의 수량 일치를 확인한 후 인수한다.
    비고: "★ 검사와 검수는 별개 절차다. 규격서에서도 조를 나눠 적어야 현장에서 분리 시행된다 (AUD-045)."

  # ---------------- 5. 하자보수 ----------------
  - id: WAR-01
    절: 5
    유형: 하자보수
    제목: 하자담보 책임
    출처: 표준
    본문: |
      가. 하자담보책임기간 : 검수완료일로부터 [[ 1 ]]년
      나. 기간 중 발생한 하자는 계약상대자의 부담으로 보수한다.
      다. 하자보수보증금은 계약조건에 따른다.
      라. 하자 통보 후 [[ 24 ]]시간 이내 현장 도착, [[ 72 ]]시간 이내 조치 완료를
          원칙으로 한다.
    비고: |
      물품은 정보통신공사업법 시행령 제37조의 법정 하자담보기간 대상이 아니다.
      다만 설치분이 정보통신공사에 해당하면 공사분에 법정 기간이 적용될 수 있다.
      (99_확인필요 ⑮ 참조)

  - id: WAR-02
    절: 5
    유형: 하자보수
    제목: 기술지원 및 교육
    출처: 관행
    본문: |
      가. 계약상대자는 검수완료 후 발주기관 운영인력에 대하여
          [[ 4 ]]시간 이상의 운용 교육을 실시한다.
      나. 하자담보책임기간 중 기술지원 창구와 연락처를 제출하여야 한다.

  # ---------------- 6. 기타 ----------------
  - id: ETC-01
    절: 6
    유형: 기타
    제목: 보안
    출처: 표준
    본문: |
      가. 계약상대자는 본 사업 수행 중 취득한 일체의 정보를 외부에 누설하여서는
          아니 되며, 대표자 및 참여자는 보안각서를 제출한다.
      나. 공항 내 작업 시 발주기관의 보안 절차와 출입 통제에 따른다.

  - id: ETC-02
    절: 6
    유형: 기타
    제목: 안전관리
    출처: 표준
    조건: 설치작업있음
    본문: |
      가. 계약상대자는 산업안전보건법에 따른 안전조치를 이행한다.
      나. 총공사금액 4천만원 이상인 경우 산업안전보건관리비를 계상·집행하고
          사용내역서를 제출하여야 한다.
      다. 작업 전 위험성평가를 실시하고 결과를 제출한다.
    검증룰: [AUD-044]

# -----------------------------------------------------------------------------
# 품목별 특기시방 조항 (2절)
# -----------------------------------------------------------------------------
품목조항:

  # ---------------- CCTV ----------------
  - id: SPEC-CCTV-01
    절: 2
    제목: 네트워크 카메라
    출처: 관행
    본문: |
      가. 해상도 : [[해상도]] 이상
      나. 프레임 : 최대 해상도에서 [[프레임]] 이상
      다. 압축방식 : [[압축방식]] 및 하위 코덱 지원
      라. 야간 촬영 : 적외선 조명 내장 또는 저조도 촬영 기능
      마. 전원 : PoE (IEEE 802.3af/at) 지원
      바. 옥외 설치분 : 방진방수 [[방진방수]] 이상, 동작온도 [[동작온도]]
      사. 수량 : [[카메라수량]]

  - id: SPEC-CCTV-02
    절: 2
    제목: 영상저장장치
    출처: 관행
    본문: |
      가. 채널 : 설치 카메라 수량을 수용하고 [[ 20 ]]% 이상 여유 채널 확보
      나. 저장기간 : 전 채널 동시 녹화 기준 [[저장기간]] 이상
      다. 저장장치 : RAID 구성으로 디스크 1개 장애 시에도 녹화 지속
      라. 전원 이중화 지원

  - id: SPEC-CCTV-03
    절: 2
    제목: 통합관제 소프트웨어
    출처: 관행
    본문: |
      가. 실시간 감시, 녹화 영상 검색·재생, 이벤트 관리 기능
      나. 기존 관제시스템과의 연동 : [[ 연동 대상과 방식을 명기 ]]
      다. 사용자 권한 관리 및 접근 이력 기록
      라. 라이선스 : 설치 채널 수 이상, 영구 사용

  - id: SPEC-CCTV-04
    절: 2
    제목: 개인영상정보 보호
    출처: 표준
    본문: |
      가. 「개인정보 보호법」 제25조에 따른 안전성 확보 조치를 적용한다.
      나. 영상정보 접근 권한을 관리하고 접근 기록을 보관한다.
      다. 저장 영상의 보관기간 경과 시 자동 삭제 기능을 제공한다.

  # ---------------- 네트워크 ----------------
  - id: SPEC-NET-01
    절: 2
    제목: 장비 일반
    출처: 관행
    본문: |
      가. 포트 구성 : [[포트구성]]
      나. 스위칭 용량 : [[스위칭용량]] 이상
      다. 이중화 : [[이중화]]
      라. 관리 : [[관리방식]]
      마. 랙 마운트형, 19인치 표준 랙 장착 가능

  - id: SPEC-NET-02
    절: 2
    제목: 보안 요구사항
    출처: 표준
    본문: |
      가. 국가정보원 보안적합성 검증 대상 여부를 확인하고,
          대상인 경우 검증필 제품을 납품한다.
      나. 기본 관리자 계정 및 비밀번호는 납품 시 변경하여 인계한다.
      다. 불필요한 서비스 및 포트는 비활성화하여 납품한다.

  - id: SPEC-NET-03
    절: 2
    제목: 기존 시스템 연동
    출처: 관행
    본문: |
      가. 기존 운용 중인 [[ 대상 시스템 ]]과 연동 가능하여야 한다.
      나. 연동 시험은 발주기관 입회하에 실시한다.
      다. 연동에 필요한 부속 자재는 계약상대자 부담으로 한다.

  # ---------------- 전원설비 ----------------
  - id: SPEC-PWR-01
    절: 2
    제목: 정격 및 성능
    출처: 관행
    본문: |
      가. 정격용량 : [[정격용량]]
      나. 입출력 : [[입출력]]
      다. 백업시간 : [[백업시간]]
      라. 효율 : [[효율]]
      마. 병렬 운전 및 무순단 절체 지원

  - id: SPEC-PWR-02
    절: 2
    제목: 축전지
    출처: 관행
    본문: |
      가. 종류 및 용량 : [[ 종류와 Ah 용량을 명기 ]]
      나. 설계수명 : [[ 10 ]]년 이상
      다. 축전지 상태 감시 기능 제공

  - id: SPEC-PWR-03
    절: 2
    제목: 시험 및 성적서
    출처: 표준
    본문: |
      가. 납품 물품에 대하여 다음 시험을 실시하고 성적서를 제출한다.
          - 정격부하 시험
          - 백업시간 시험
          - 효율 시험
          - 절연저항 및 내전압 시험
      나. 성적서는 3절 제출물의 시험성적서 요건을 충족하여야 한다.
    비고: "★ 이 품목에서 시험성적서 지적이 실제로 발생했다. 시험 항목을 구체적으로 열거할 것."

