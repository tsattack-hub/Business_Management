- id: DOC-자재승인알림
  명칭: 주요기자재 공급원 승인 알림
  format: hwpx
  단계: P3
  태스크: T-P3-030
  근거: "공사감독규정 제14조 제2항·제3항"
  설명: "★ 검토만 하고 부서장 보고·승인 결재를 누락한 지적 사례가 있습니다."
  blocks:
    - {type: heading, level: 1, text: "1. 검토 내용"}
    - {type: paragraph, text: "「{사업명}」의 주요기자재 공급원 승인신청서를 검토한 결과 다음과 같이 품질기준에 적합함을 확인하였기에 승인 통보합니다."}
