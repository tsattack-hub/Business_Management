        {k: 사 업 명, v: "{사업명}"},
        {k: 계약종류, v: "{계약유형}"},
        {k: 추정가격, v: "{추정가격}"},
        {k: 계약방법, v: "{조달트랙}"},
        {k: 낙찰방법, v: "{낙찰방법}"},
        {k: 이행기간, v: "계약일로부터 {이행기간}일"},
