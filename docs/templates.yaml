        {n: 1, d: 계약요청서, c: 1},
        {n: 2, d: 시행계획보고, c: 1},
        {n: 3, d: 시행결의서, c: 1},
        {n: 4, d: 원가계산서, c: 1},
        {n: 5, d: 내역서, c: 1},
        {n: 6, d: 구매규격서, c: 1},
