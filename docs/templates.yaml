# =============================================================================
# 서류 틀 정의
# -----------------------------------------------------------------------------
# 각 서류의 뼈대를 여기에 적는다. 코드는 이 파일을 읽어서 파일을 만들 뿐이다.
# 양식이 바뀌면 이 파일만 고치면 된다.
#
# 치환자  {사업명} {연도} {공항} {부서} {담당자} {오늘} {추정가격} {추정가격_한글}
#         {목표준공일} {계약유형} {설치비중} {조달트랙} {낙찰방법} {이행기간}
#         {물품분} {설치분} {총설계금액}
#
# 블록 타입
#   heading    level(1~3), text
#   paragraph  text
#   bullets    items[]
#   table      columns[{key,label}], rows[{...}]  /  rows 대신 fill: n 이면 빈 행 n개
#   fillin     label, hint      → "( 작성 필요 )" 로 표시되는 빈칸
#   page_break
#
# xlsx 서류는 sheets[] 로 정의한다.
# =============================================================================

schema_version: "kac.doctpl.v1"

공통:
  머리말: "한 국 공 항 공 사"
  꼬리말: "{부서}"
  결재란: [기안, 검토, 전결]

서류:

# ==========================================================================
# P1 설계
# ==========================================================================
- id: DOC-계약유형판정근거
  명칭: 물품·공사 혼합계약 유형 판정 근거표
  format: xlsx
  단계: P1
  태스크: T-P1-020
  근거: "(계약예규) 정부 입찰·계약 집행기준 — 물품·공사 등 혼합계약 집행기준"
  설명: "규정에 정해진 서식이 없습니다. 감사에서 계약방법 선택 근거를 물으면 이 한 장으로 답이 됩니다."
  sheets:
    - name: 판정근거
      title: "물품·공사 혼합계약 유형 판정 근거표"
      subtitle: "{사업명}"
      rows:
        - ["작 성 일", "{오늘}"]
        - ["작성부서", "{부서}"]
        - ["작 성 자", "{담당자}"]
        - []
        - ["【 산정 근거 】"]
        - ["구        분", "금        액", "귀속", "비        고"]
        - ["재료비 (직접재료비)", "{물품분}", "물품분", "장비·자재의 순수 가격"]
        - ["직접노무비", "{설치분_노무}", "설치분", "설치 인력 투입분"]
        - ["경비 (기계경비·가설비 등)", "{설치분_경비}", "설치분", "설치에 수반되는 경비"]
        - ["합        계", "{총설계금액}", "", ""]
        - []
        - ["【 판정 】"]
        - ["설치비중", "{설치비중}", "", "설치분 ÷ 전체 설계금액"]
        - ["판정 기준", "50%", "", "50% 이상이면 공사계약"]
        - ["판 정 결 과", "{계약유형}", "", ""]
        - []
        - ["【 판정에 따른 후속 적용 】"]
        - ["원가계산 비목", "물품분·설치분 분리 계상", "", "CC-007 — 소관부서 확인 필요"]
        - ["낙찰방법", "{낙찰방법}", "", ""]
        - ["완료 절차", "검사 + 검수 (물품관리규정 제18조)", "", "공사의 준공검사와 다름"]
        - ["하자담보", "구매규격서·계약조건에 정한 기간", "", "법정 기간 아님"]
        - []
        - ["※ 설치비중이 45~55% 구간이면 비목별 귀속 근거를 반드시 보강할 것."]
        - ["※ 과거 지적 사례: 배관·배선공사가 50% 이상인데 20%로 산정한 건이 있음."]

- id: DOC-사전공개의뢰서
  명칭: 구매규격 사전공개 의뢰
  format: hwpx
  단계: P1
  태스크: T-P1-090
  근거: "계약업무처리지침 제11조 / 구매규격 사전공개제도 운영지침 제2조·제4조"
  설명: "구매설치는 금액과 무관하게 전건 대상입니다. 일상감사보다 먼저 해야 합니다."
  blocks:
    - {type: heading, level: 1, text: "1. 관련 근거"}
    - {type: bullets, items: [
        "계약업무처리지침 제11조 (구매규격 사전공개)",
        "구매규격 사전공개제도 운영지침 제2조·제4조",
        "(계약예규) 정부 입찰·계약 집행기준 제77조"]}
    - {type: heading, level: 1, text: "2. 사업 개요"}
    - {type: table, columns: [{key: k, label: 구분}, {key: v, label: 내용}], rows: [
        {k: 사 업 명, v: "{사업명}"},
        {k: 사업위치, v: "{공항}"},
        {k: 추정가격, v: "{추정가격} (부가세 별도)"},
        {k: 사업기간, v: "계약일로부터 {이행기간}일"},
        {k: 주관부서, v: "{부서}"}]}
    - {type: heading, level: 1, text: "3. 공개 요청 사항"}
    - {type: bullets, items: [
        "공개 기간: 5일 이상",
        "공개 자료: 구매규격서 1부",
        "접수된 의견은 규격서 및 시행계획에 반영 후 일상감사 의뢰 예정"]}
    - {type: heading, level: 1, text: "4. 붙임"}
    - {type: bullets, items: ["구매규격서 1부.", "사전공개 의견 접수 양식 1부.  끝."]}
    - {type: fillin, label: "공개 희망일", hint: "의뢰일로부터 2일 이후"}

- id: DOC-시행계획보고
  명칭: 시행계획보고
  format: hwpx
  단계: P1
  태스크: T-P1-140
  근거: "감사기준시행세칙 제43조·제44조의2 / 인사관리실 시달 보고서 양식"
  설명: "일상감사 중점 검토사항 10개 항목이 본문에 모두 들어가야 합니다. 빠지면 반송됩니다."
  blocks:
    - {type: heading, level: 1, text: "1. 관련 근거"}
    - {type: fillin, label: "관련 근거", hint: "사업계획 승인 문서번호, 예산 근거 등"}
    - {type: heading, level: 1, text: "2. 사업 개요"}
    - {type: table, columns: [{key: k, label: 구분}, {key: v, label: 내용}], rows: [
        {k: 사 업 명, v: "{사업명}"},
        {k: 사업위치, v: "{공항}"},
        {k: 사업유형, v: "{계약유형}  (설치비중 {설치비중})"},
        {k: 추정가격, v: "{추정가격} (부가세 별도)"},
        {k: 총설계금액, v: "{총설계금액}"},
        {k: 사업기간, v: "계약일로부터 {이행기간}일 / 준공목표 {목표준공일}"},
        {k: 계약방법, v: "{조달트랙}"},
        {k: 낙찰방법, v: "{낙찰방법}"},
        {k: 주관부서, v: "{부서}"}]}
    - {type: heading, level: 1, text: "3. 사업 추진의 합법성 및 필요성"}
    - {type: fillin, label: "합법성 및 필요성", hint: "근거 법령·규정과 사업이 필요한 이유"}
    - {type: heading, level: 1, text: "4. 사업추진 내용의 타당성"}
    - {type: fillin, label: "경제성 · 효과성 · 효율성", hint: "세 가지를 각각 서술"}
    - {type: heading, level: 1, text: "5. 사업 목적의 명확성"}
    - {type: fillin, label: "사업 목적", hint: "무엇을 달성하려는지 구체적으로"}
    - {type: heading, level: 1, text: "6. 사업 추진 주체의 적정성"}
    - {type: fillin, label: "추진 주체", hint: "왜 이 부서가 시행하는지"}
    - {type: heading, level: 1, text: "7. 재원 조달 및 집행의 적절성"}
    - {type: fillin, label: "재원", hint: "예산과목, 편성액, 집행계획"}
    - {type: heading, level: 1, text: "8. 원가계산 및 예정가격 산정의 적정성"}
    - {type: bullets, items: [
        "표준품셈 및 조달청 원가계산 제비율 최신본 적용",
        "단가는 2개 이상 복수 조사 후 비교 선정",
        "물품분·설치분을 분리 계상"]}
    - {type: fillin, label: "적용한 품셈·제비율 판번", hint: "예: 정보통신 표준품셈 2026, 조달청 제비율 2026.04.13"}
    - {type: heading, level: 1, text: "9. 계약방법 및 절차의 적정성"}
    - {type: fillin, label: "계약방법 선택 사유", hint: "지명입찰·수의계약이면 해당 사유를 반드시 명시"}
    - {type: heading, level: 1, text: "10. 예산의 목적 외 사용 여부"}
    - {type: paragraph, text: "편성 목적대로 집행하며, 낙찰차액 발생 시 예산관리자와 사전 협의 후 처리한다."}
    - {type: heading, level: 1, text: "11. 기타 방만 경영 해당 여부"}
    - {type: paragraph, text: "해당 사항 없음."}
    - {type: heading, level: 1, text: "12. 추진 일정"}
    - {type: table, columns: [{key: s, label: 절차}, {key: d, label: 예정일}, {key: n, label: 비고}], fill: 8}
    - {type: heading, level: 1, text: "13. 붙임"}
    - {type: bullets, items: [
        "원가계산서 및 내역서 1부.",
        "구매규격서 1부.",
        "계약유형 판정 근거표 1부.",
        "수량산출서 1부.  끝."]}

- id: DOC-시행결의서
  명칭: 시행결의서
  format: hwpx
  단계: P1
  태스크: T-P1-140
  근거: "건설사업실 시달 양식"
  설명: "첨부 순서를 지키세요. 계약부서에서 순서대로 확인합니다."
  blocks:
    - {type: table, columns: [{key: k, label: 구분}, {key: v, label: 내용}], rows: [
        {k: 사 업 명, v: "{사업명}"},
        {k: 사업연도, v: "{연도}"},
        {k: 사업위치, v: "{공항}"},
        {k: 추정가격, v: "{추정가격}"},
        {k: 총설계금액, v: "{총설계금액}"},
        {k: "  물품분", v: "{물품분}"},
        {k: "  설치분", v: "{설치분}"},
        {k: 계약방법, v: "{조달트랙}"},
        {k: 낙찰방법, v: "{낙찰방법}"},
        {k: 이행기간, v: "계약일로부터 {이행기간}일"}]}
    - {type: heading, level: 1, text: "예산 조서"}
    - {type: table, columns: [{key: a, label: 예산과목}, {key: b, label: 편성액}, {key: c, label: 기집행}, {key: d, label: 금회}, {key: e, label: 잔액}], fill: 3}
    - {type: heading, level: 1, text: "첨부 서류"}
    - {type: bullets, items: [
        "1. 예산조서",
        "2. 수량조서",
        "3. 원가계산서 및 내역서",
        "4. 구매규격서",
        "5. 설치 위치도 / 시스템 구성도",
        "6. 계약유형 판정 근거표",
        "7. 보안성검토 결과"]}

- id: DOC-계약의뢰서
  명칭: 계약의뢰서
  format: hwpx
  단계: P1
  태스크: T-P1-150
  근거: "계약업무처리지침"
  설명: "첨부 8종을 한 세트로 묶어 계약부서에 넘깁니다."
