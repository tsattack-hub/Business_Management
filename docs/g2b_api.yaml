# =============================================================================
# 조달청 나라장터 사전규격정보서비스 — API 설정
# -----------------------------------------------------------------------------
# ★ 아래 응답 필드명은 확정되지 않았습니다.
#
#   공공데이터포털이 자동 접근을 막아 활용명세서를 기계적으로 읽을 수 없었습니다.
#   candidates 는 조달청 API의 통상적인 작명 규칙으로 추정한 후보 목록이고,
#   클라이언트는 응답에서 실제 존재하는 첫 후보를 씁니다.
#
#   최초 1회 반드시 probe 를 돌려 실제 필드명을 확인하십시오.
#
#       python scripts/collect.py probe --key 발급받은키
#
#   실제 응답의 키 목록이 출력되고, candidates 에 없는 이름은 경고로 표시됩니다.
#   그때 이 파일의 candidates 맨 앞에 실제 이름을 추가하면 됩니다.
#
# 활용신청: https://www.data.go.kr/data/15129437/openapi.do
# =============================================================================

schema_version: "kac.g2bapi.v1"

api:
  base: "https://apis.data.go.kr/1230000/ao/HrcspSsstndrdInfoService"
  status: unverified          # 엔드포인트 경로는 공개 자료로 확인됨, 필드명은 미확인
  출처: "공공데이터포털 조달청_나라장터 사전규격정보서비스 (15129437)"

  # 업무 구분별 오퍼레이션. 구매설치는 보통 '물품'이다.
  operations:
    물품: getPublicPrcureThngInfoThng
    용역: getPublicPrcureThngInfoServc
    공사: getPublicPrcureThngInfoCnstwk
    외자: getPublicPrcureThngInfoFrgcpt

  # 검색조건 조회 오퍼레이션 (품명 키워드 검색이 되는 쪽)
  search_operations:
    물품: getPublicPrcureThngInfoThngPPSSrch
    용역: getPublicPrcureThngInfoServcPPSSrch
    공사: getPublicPrcureThngInfoCnstwkPPSSrch
    외자: getPublicPrcureThngInfoFrgcptPPSSrch

  # 요청 파라미터 이름
  params:
    key: serviceKey
    page: pageNo
    rows: numOfRows
    type: type                    # json
    begin: inqryBgnDt             # YYYYMMDD 또는 YYYYMMDDHHmm
    end: inqryEndDt
    inquiry_div: inqryDiv         # 1=공개일자, 2=등록번호 등 (문서 확인 필요)
    keyword: prdctClsfcNoNm       # 품명
    org: dminsttNm                # 수요기관명

  # 요청 기본값
  defaults:
    rows: 100
    type: json
    inquiry_div: "1"

  # 한 번에 조회할 수 있는 기간 상한 (일). 초과하면 구간을 쪼갠다.
  max_range_days: 31

  # 요청 간 대기 (초). 부하를 주지 않기 위한 값. 낮추지 마십시오.
  throttle_sec: 0.7

# -----------------------------------------------------------------------------
# 응답 필드 매핑 — 왼쪽이 우리가 쓰는 이름, candidates 가 응답에서 찾을 후보들
# -----------------------------------------------------------------------------
fields:
  등록번호:
    candidates: [bfSpecRgstNo, sptBidRgstNo, presmptRegNo, rgstNo, bidNtceNo]
    설명: 사전규격등록번호
  사업명:
    candidates: [prdctClsfcNoNm, bfSpecNm, ntceNm, bsnsNm, prdctSpecNm]
    설명: 품명 또는 사업명
  공개일자:
    candidates: [rcptDt, bfSpecRgstDt, opengDt, rgstDt]
    설명: 사전규격공개일자
  마감일자:
    candidates: [opninRgstClseDt, opnnRgstClseDt, cmmnSpldmdCorpRgnLmtYn, opnnClseDt]
    설명: 의견등록마감일자
  수요기관:
    candidates: [rlDminsttNm, dminsttNm, ntceInsttNm, orgNm]
    설명: 수요기관명
  수요기관코드:
    candidates: [dminsttCd, ntceInsttCd]
  공고기관:
    candidates: [ntceInsttNm, orderInsttNm]
  배정예산:
    candidates: [asignBdgtAmt, bdgtAmt, presmptPrce]
    설명: 배정예산액
  규격내용:
    candidates: [prdctDtlList, prdctSpecNm, specDoc, bfSpecCntnts, prdctSpecCntnts]
    설명: 사전규격물품내용
  규격서파일:
    candidates: [specDocFileUrl1, rlDocFileUrl1, specFileUrl, atchFileUrl1, ntceSpecDocUrl1]
    설명: 관련규격서파일 URL
    다중: true                    # ...URL1, URL2 처럼 번호가 붙어 여러 개일 수 있다
    다중최대: 10
  규격서파일명:
    candidates: [specDocFileNm1, rlDocFileNm1, atchFileNm1, ntceSpecDocNm1]
    다중: true
    다중최대: 10
  의견수:
    candidates: [opnnRgstCnt, opnnCnt]
  납품기한:
    candidates: [dlvrTmlmtDt, dlvrTmlmt, dlvrDe]
  조달구분:
    candidates: [bsnsDivNm, prcrmntDiv, dscrptId]
  담당자:
    candidates: [ntceInsttOfclNm, chrgDeptTelNo, ofclNm]

# -----------------------------------------------------------------------------
# 수집 필터 — 우리에게 쓸모 있는 것만 남긴다
# -----------------------------------------------------------------------------
filters:
  # 사업명에 하나라도 걸리면 수집 대상
  키워드:
    CCTV: [영상감시, CCTV, 폐쇄회로, 카메라, 관제, NVR]
    NETWORK: [스위치, 라우터, 네트워크, 광전송, 백본, 전송장비]
    POWER: [무정전, UPS, 정류기, 축전지, 전원장치]

  # 유사 발주기관 우선. 비어 있으면 전체.
  선호기관:
    - 공항공사
    - 한국공항공사
    - 인천국제공항공사
    - 철도공사
    - 도로공사
    - 수자원공사
    - 전력공사

  # 이 확장자만 내려받는다
  허용확장자: [.hwp, .hwpx, .pdf, .doc, .docx]

  # 첨부파일 이름에 이것이 있으면 규격서로 본다 (제안요청서·공고문 등은 제외)
  규격서_파일명패턴: [규격, 시방, 과업, 사양, 명세, spec]
  제외_파일명패턴: [공고문, 입찰공고, 유의서, 계약서, 서식, 양식, 산출내역]

collect:
  # 한 번 실행에서 내려받을 파일 수 상한. 대량 수집을 막기 위한 안전장치.
  max_files_per_run: 50
  # 파일 1개 최대 크기 (MB)
  max_file_mb: 20
  download_throttle_sec: 1.5
  user_agent: "KAC-procurement-spec-collector/0.1 (internal use)"
