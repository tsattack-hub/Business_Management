# =============================================================================
# 04. 감사 검증룰
# -----------------------------------------------------------------------------
# 감사 지적사례를 "검증 가능한 룰"로 변환한 것.
#
# 검증방식(mode)
#   auto   : 파일 파싱·수식 계산으로 프로그램이 판정 가능. 위반 시 오류(error)
#   semi   : 프로그램이 후보를 탐지하고 사람이 판단. 위반 시 경고(warning)
#   manual : 프로그램은 확인 요구만. 체크 이력 자체가 감사 대응 근거
#
# 검증시점(gate) : 이 단계 완료 전에 검사가 통과해야 한다
# 심각도(severity) : blocker(진행 차단) / error / warning / info
#
# 프로그램 구현 시 유의
#   · 위반 메시지에는 반드시 근거 조항을 함께 출력한다 (감사 수감 시 그대로 제시 가능)
#   · manual 항목은 "확인함" 체크와 확인자·일시를 DB에 남긴다
#   · blocker는 사용자가 사유를 입력하면 우회 가능하게 하되, 사유를 이력에 남긴다
# =============================================================================

schema_version: "kac.audit.v1"

검증룰:

# -----------------------------------------------------------------------------
# A. 예산 집행
# -----------------------------------------------------------------------------
- id: AUD-001
  분류: 예산집행
  명칭: 사업 목적 외 예산 집행
  지적사례: |
    설계비·공사비·감리비 낙찰차액을 총사업비 감액·불용처리 없이
    예산관리자 사전협의 없이 다른 용도로 집행
  근거:
    - "예산운용지침 제13조 제3항"
    - "감사기준시행세칙 제44조의2 제9호 (예산의 목적 외 사용여부)"
  검증방식: semi
  심각도: error
  검증시점: [T-S1-110, T-S1-140, T-S5-080]
  판정로직: |
    IF 사업의 예산과목 != 원래 편성 목적
       OR (낙찰차액 발생 AND 감액조정·불용처리 이력 없음 AND 예산관리자 사전협의 문서 없음)
    THEN 경고
  요구증빙: [예산관리자 사전협의 문서, 총사업비 감액조정 내역]

