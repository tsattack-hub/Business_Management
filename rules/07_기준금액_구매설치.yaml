    status: unverified          # ★ HWP 내에서 1억원 / 5천만원 두 값이 혼재
    적용:
      - 시행일: null
        조건: { 조달트랙: 제3자단가, 추정가격: { ">=": 100000000 } }
        결과: { 구매방식: MAS_2단계경쟁 }
        출처: "HWP — '단 1억원 이상 3자단가 구매의 경우 MAS로 구매' (중기간경쟁제품 문맥)"
      - 시행일: null
        조건: { 조달트랙: 제3자단가, 추정가격: { ">=": 50000000 } }
        결과: { 구매방식: MAS_2단계경쟁 }
        출처: "HWP — '단 5천만원 이상 3자단가 구매의 경우 MAS로 구매' (중기간경쟁제품 아닌 문맥)"
    비고: |
