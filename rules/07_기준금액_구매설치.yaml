# -----------------------------------------------------------------------------
# 1. 계약유형 판정 — 구매설치의 첫 분기점
# -----------------------------------------------------------------------------
계약유형판정:

  - id: MX-001
    명칭: 물품·공사 혼합계약의 계약유형 판정
    근거:
      - "(계약예규) 정부 입찰·계약 집행기준 — 물품·공사 등 혼합계약 집행기준 (2016-12-30 개정)"
      - "(계약예규) 물품구매(제조)계약 일반조건"
      - "HWP 사업집행절차 — '설계금액 50% 이상 → 공사(용역)계약 / 50% 미만 → 물품제조구매계약'"
    status: unverified          # ★ 조항 번호가 HWP에 기재되지 않음. 원문 확인 필요
    적용:
      - 시행일: "2016-12-30"
        판정식: |
          설치비중 = 설치(공사) 부분 설계금액 / 전체 설계금액
          IF 설치비중 >= 0.50 THEN 계약유형 = 공사계약
          ELSE                     계약유형 = 물품제조·구매계약
        결과분기:
          공사계약: "02_절차템플릿_정보통신공사.yaml 적용"
          물품제조구매계약: "06_절차템플릿_구매설치.yaml 적용"
    산정방법:
      물품부분: "장비·자재의 재료비 (제조원가 기준)"
      설치부분: "설치 직접노무비 + 설치 관련 경비 (기계경비, 가설비 등)"
    필수산출물: DOC-계약유형판정근거
    주의: |
      ★ HWP 기재 실제 문제: "배관/배선공사 : 50% 이상 공사인데 20%라 한 경우 있음"
      비중 산정 근거를 수량산출서·내역서 기준으로 문서화하지 않으면
      감사에서 계약방법 선택의 적정성을 다투게 된다.
    검증룰: AUD-039

