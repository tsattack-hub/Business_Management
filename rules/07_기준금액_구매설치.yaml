      원문 확인 후 조건에 중기간경쟁제품 여부를 추가할 것.

  - id: PC-003
    명칭: 중기간경쟁제품이 아닌 물품의 우선조달계약
    근거:
      - "계약업무처리지침 제17조의2"
      - "중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령 제2조의2"
    status: confirmed
    비고: "01_기준금액.yaml 의 계약방법-물품 (CM-P-*) 과 동일 로직. 여기서는 참조만"
    참조: [CM-P-05, CM-P-06, CM-P-07]

