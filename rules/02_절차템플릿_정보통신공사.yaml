# =============================================================================
# 02. 절차 템플릿 — 정보통신공사 (기준 유형)
# -----------------------------------------------------------------------------
# 설계 원칙: 사업유형별로 템플릿을 복제하지 않는다.
#   · 공통 태스크는 하나만 정의하고 activate_if 로 조건 분기
#   · 용역/물품/구매설치는 이 템플릿을 상속하고 차이만 override
#     (03_절차템플릿_차이.yaml 참조)
#
# 필드 규약
#   id           : 전역 유일. 태스크 인스턴스가 이 id를 참조
#   선행          : 이 태스크 착수 전 완료되어야 하는 태스크 id 배열 (게이트)
#   activate_if  : 조건 미충족 시 태스크가 절차에서 제거됨
#   리드타임      : 04_리드타임.yaml 의 LT-* 참조
#   산출물        : 05_서식.yaml 의 DOC-* 참조 (자동생성 대상)
#   징구서류      : 업체로부터 받아야 하는 서류 (자동생성 대상 아님, 체크리스트)
#   검증룰        : 06_감사검증룰.yaml 의 AUD-* 참조
# =============================================================================

schema_version: "kac.procedure.v1"
사업유형: 정보통신공사
근거문서: [공사절차서, "HWP 사업집행 및 계획시 관리절차", "감사사례 공유 및 토의"]

단계:

# =============================================================================
- 단계id: S1
  명칭: 설계
  설명: 현장실사부터 계약의뢰까지. 감사 리스크가 가장 많이 발생하는 구간.
  태스크:

    - id: T-S1-010
      명칭: 현장실사 및 자료조사
      산출물: [DOC-현장실사조서]
      비고: "관계부서 의견수렴 병행"

    - id: T-S1-020
      명칭: 공항개발사업 시행허가·실시계획 신청
      선행: [T-S1-010]
      activate_if: { 공항개발사업해당: true }
      리드타임: [LT-공항시행허가, LT-공항실시계획]
      근거: "공항시설법 제6조·제7조, 시행규칙 제9조·제10조"
      비고: "일상적인 유지보수는 제외 (법 제6조 제2항)"

    - id: T-S1-030
      명칭: 설계서 작성
      선행: [T-S1-010]
      작성순서:
        - 자료조사
        - 수량산출서
        - 단가조사서
        - 일위대가표
        - 예산내역서
        - 시방서
      산출물: [DOC-수량산출서, DOC-단가조사서, DOC-일위대가표, DOC-원가계산서, DOC-내역서, DOC-시방서, DOC-설계도면]
      검증룰:
        - AUD-013   # 특정회사 규격 명기
        - AUD-014   # 수량산출서 ↔ 내역서 불일치
        - AUD-015   # 제비율 최신본 미적용
        - AUD-016   # 비목 위치 임의 이동
        - AUD-017   # 가설비·기계경비 중복 계상
        - AUD-018   # 할증 근거 없음
        - AUD-019   # 단가 복수조사 미이행
        - AUD-020   # 도면·시방·내역 불일치
        - AUD-021   # 물품에 간접노무비·기타경비 적용
        - AUD-025   # 용역 직접경비 실비정산 명기 누락

    - id: T-S1-040
      명칭: 보안성 검토 요청
      선행: [T-S1-030]
      activate_if: { 시설물신축_증개축: true }
      근거: "보안업무규정 제137조 (별지 제56호 서식)"
      산출물: [DOC-보안성검토요청서]
      징구서류: [시스템구성도, 사업시행위치도]
      절차:
        - "보안담당관(지원총괄)에게 검토 의뢰"
        - "필요시 보안관계기관(국정원) 협의 — 사전 방문 설명 후 문서 제출"
        - "검토결과를 설계에 반영"
        - "사업완료 후 보안성 측정 요구"
      예외: "중요장비가 설치되지 않는 경미한 개수 작업(사무실 수리 등)은 생략 가능"
      비고: "본사 주관 정보보안 또는 전 지사 보안업무에 영향을 미치는 사업은 본사 보안담당관"

    - id: T-S1-050
      명칭: 정보화사업 보안성 검토
      선행: [T-S1-030]
      activate_if: { 정보화사업: true }
      시점: "계획단계 (입찰공고 전)"
      근거: "정보보안업무세부지침 제15조·제19조"
      절차:
        - "사이버보안센터에 보안성 검토 요청"
        - "국토부(국정원) 보안성검토결과에 대한 이행계획 제출"
        - "사업종료 시 이행계획 실행 증빙 제출"

    - id: T-S1-060
      명칭: 소프트웨어사업 과업심의위원회
      선행: [T-S1-030]
      activate_if: { 소프트웨어사업: true }
      시점: "사전규격공개 전"
      근거: "소프트웨어진흥법 제50조"
      비고: "정기 개최 일정에 맞춰 신청 — 일정 여유 필요"

    - id: T-S1-070
      명칭: 방송장비 규격서 심의위원회
      선행: [T-S1-030]
      activate_if: { 방송장비구축: true, 추정가격: { ">=": 100000000 } }
      근거: "공공기관 방송장비 구축운영 지침 제3조·제4조·제5조"
      비고: "사전공개 결과 의견이 있을 때 구성·운영 (의견 수용 시 생략 가능)"

    - id: T-S1-075
      명칭: 행정예고 (영상정보처리기기 설치 시)
      선행: [T-S1-030]
      activate_if: { CCTV설치: true }
      시점: "발주 전 (일상감사 전)"
      리드타임: [LT-행정예고]
      근거: "개인정보보호법 제25조 제1항, 동법 시행령 제23조, 행정절차법"
      절차:
        - "공사 홈페이지에 20일 이상 게시"
        - "행정예고 시행결과 보고"
      비고: "HWP 사례에서 실제 이행. 20일 게시가 전체 일정을 크게 좌우함"

    - id: T-S1-080
      명칭: 우선구매 대상 검토
      선행: [T-S1-030]
      시점: "발주 전 (시행방침 수립 전)"
      근거: "계약업무처리지침 제10조"
      검토대상:
        - 중소기업제품
        - 기술개발제품
        - 여성기업제품
        - 사회적기업
        - "장애인생산품 (중증장애인 직접생산제품, 장애인표준사업장제품, 장애인기업제품)"
      비고: "계약부서에 가능 여부 검토 의뢰"

    - id: T-S1-085
      명칭: 관급자재 직접구매 대상 판정
      선행: [T-S1-030]
      룰: [DP-001, DP-002, DP-003, DP-004, DP-005]
      근거: "중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령 제11조"
      결과: "대상이면 관급자재로 설계에 반영 → 별도 구매 절차(T-S1-087) 생성"
      검증룰: [AUD-024]

    - id: T-S1-087
      명칭: 관급자재 구매계획 수립 및 계약의뢰
      선행: [T-S1-085]
      activate_if: { 관급자재있음: true }
      산출물: [DOC-관급자재구매총괄표, DOC-관급자재목록, DOC-구매계획보고]
      비고: "본 공사와 별개의 계약 트랙. 납품 시점이 공정에 물리므로 일정 연동 필수"

    - id: T-S1-090
      명칭: 구매규격 사전공개 의뢰
      선행: [T-S1-030, T-S1-060]
      activate_if:
        or:
          - { 사업유형: 공사, 추정가격: { ">=": 100000000 } }
          - { 사업유형: [용역, 물품구매, 구매설치] }   # 금액 무관
      시점: "★ 일상감사 의뢰 이전 (시행방침 결정 이전)"
      리드타임: [LT-사전규격공개]
      근거:
        - "계약예규 정부 입찰계약 집행기준 제77조"
        - "계약업무처리지침 제11조"
        - "구매규격 사전공개제도 운영지침 제2조·제4조"
      산출물: [DOC-사전공개의뢰서]
      징구서류: []
      제출자료: [구매규격서, 시방서, 과업내용서, 제안요청서]
      후속: "접수된 외부 의견을 반영해 시행계획서·규격서 수정"
      예외:
        - "공사에서 지정한 규격서가 없는 조달구매 또는 분기자재"
        - "해당연도에 1회 이상 공개 실적이 있는 물품·용역"
      주의: "이 태스크 누락이 일상감사 반송의 흔한 원인. 공개기간 5일을 일정에 반드시 반영"

    - id: T-S1-100
      명칭: 일상감사 대상 판정
      선행: [T-S1-030]
      룰: [DA-006, DA-007, DA-008, DA-011]
      결과: "대상이면 T-S1-110 활성화"

    - id: T-S1-110
      명칭: 일상감사 의뢰
      선행: [T-S1-090, T-S1-100, T-S1-040]
      activate_if: { 일상감사대상: true }
      리드타임: [LT-일상감사]
      근거: "감사기준시행세칙 제41조·제43조·제44조의2"
      산출물: [DOC-시행계획보고]
      상신방법:
        시스템: "스카이넷 전자결재"
        경로: "기안작성 > '일상감사' 폴더"
        양식선택:
          부장전결사항: "(부장결재) 일상감사"
          부장이외: "(실장이상결재) 일상감사"
        결재선:
          부장전결: [기안, 검토, 전결, 일상감사]
          부장이외: [기안, 검토, 일상감사, 전결]
        투자기획부협조:
          필요: true
          근거: "기획조정실-5301(2024-12-24) 25년도 예산운용지침 개정"
          내용: "예산집행 적정성 검토 — 담당자 확인 및 투자기획부장 협조결재"
          순서: "일상감사 의뢰 → 투자기획부 협조결재 → 최종결재자 결재 전 → 일상감사 시스템 접수"
      회부시기:
        기준: "결재일 또는 시행일 기준 7일 전까지 (근무일)"
        부장전결사항: "문서 등록 및 시행 전"
        부장이외: "최종결재권자 결재 전"
      시행계획보고_필수기재사항:
        근거: "감사기준시행세칙 제44조의2 (일상감사 중점 검토사항)"
        항목:
          - 사업 추진의 합법성 및 필요성
          - "사업추진 내용의 타당성 (경제성, 효과성, 효율성)"
          - 사업 목적의 명확성
          - 사업 추진 주체의 적정성
          - 재원 조달 및 집행의 적절성
          - 원가계산 및 예정가격 산정의 적정성
          - 계약방법 및 절차의 적정성
          - "지명입찰계약·수의계약의 경우 해당 계약방법 사유 해당 여부"
          - 예산의 목적 외 사용여부
          - 기타 방만 경영 해당 여부
      검증룰: [AUD-001, AUD-010]
      사후관리:
        근거: "감사기준시행세칙 제49조의2"
        내용:
          - "일상감사 후 내용을 변경하려면 일상감사 재의뢰"
          - "변경내용이 경미하면 감사인 협의 후 변경내용·사유를 감사실에 통보"
          - "★ 일상감사 완료 사안도 감사대상에서 제외되지 않으며, 위법·부당 사항은 면책되지 않음"
      불복절차:
        - "감사인이 일상감사 의견서 작성 → 재검토 요구"
        - "의뢰부서는 접수일로부터 14일 이내 조치결과 제출"
        - "불채택 시 사유서를 접수일로부터 7일 이내 제출"
        - "사유 타당성 없으면 감사의견서 재발급 (상임감사위원 결재)"
        - "의뢰부서는 사장 보고 후 7일 이내 조치결과 제출"

    - id: T-S1-120
      명칭: 기술검토위원회 (정보통신시설분야)
      선행: [T-S1-030]
      activate_if: { 추정가격: { ">=": 100000000 } }
      제출자료: ["시행계획(안)", "규격서 또는 시방서", 원가계산서, "도면(CAD)"]
      비고: "HWP 기재 — 본사 항행시설팀 제출 전 메일 사전검토 관행. 현행 여부 확인 필요"
      status: unverified

    - id: T-S1-130
      명칭: 계약심의위원회 심의
      선행: [T-S1-030]
      activate_if:
        or:
          - { 계약방법: 수의계약, 추정가격: { ">=": 10000000 } }
          - { 낙찰방법: [2단계경쟁, 협상에의한계약] }
      시점: "시행방침 이전"
      근거:
        - "계약심의위원회 운영지침 제3조 제1항 제4호"
        - "계약업무처리지침 제13조 제3항"
      비고: "2단계경쟁·협상계약의 평가기준은 계약심의실무위원회 실시"

    - id: T-S1-140
      명칭: 시행계획 수립 및 시행결의
      선행: [T-S1-110, T-S1-130]
      리드타임: [LT-시행계획수립]
      산출물: [DOC-시행계획보고, DOC-시행결의서]
      시행결의서_첨부:
        - 예산조서
        - 수량조서
        - 지급자재조서
        - "공사원가계산서 및 내역서"
        - 공사시방서
        - 철거발생품 예정서
        - 설계도면
        - 보안성검토 결과
      결재권자: "추정가격 1억원 이상은 본부장 결재 (HWP 기재 — 현행 위임전결규정 확인 필요)"
      양식출처: "공사 및 용역 시행결의서·원가계산서 — 건설사업실 시달 양식 / 보고서 형식·결재란 — 인사관리실 시달 양식"
