# =============================================================================
# 09. 서식 — 구매설치 전용 추가분 (05_서식.yaml 에 병합되는 델타)
# -----------------------------------------------------------------------------
# 05의 서식 중 다음은 구매설치에도 그대로 사용:
#   DOC-현장실사조서, DOC-수량산출서, DOC-단가조사서, DOC-내역서,
#   DOC-시행계획보고, DOC-시행결의서, DOC-계약의뢰서, DOC-개찰결과보고서,
#   DOC-청렴서한문, DOC-선금적정성검토결과, DOC-자재승인알림,
#   DOC-검사결과보고서, DOC-검사명세서, DOC-준공검사자지정, DOC-준공검사조서,
#   DOC-준공정산합의서, DOC-준공정산내역서, DOC-철거발생품조서, DOC-재산증감내역,
#   DOC-변경내역서, DOC-하자검사계획보고, DOC-하자검사입회요청,
#   DOC-하자검사결과보고, DOC-하자검사결과알림, DOC-최종하자검사결과보고
#
# 사용하지 않는 것: DOC-시방서(→구매규격서), DOC-적격심사세부기준(→계약이행능력심사기준),
#                   DOC-공사감독조서(→감독조서)
# =============================================================================

schema_version: "kac.doctemplate.v1"

서식:

- id: DOC-계약유형판정근거
  명칭: 물품·공사 혼합계약 유형 판정 근거표
  format: xlsx
  automation: full
  태스크: [T-P1-020]
  룰: MX-001
  자동계산:
    - "내역서에서 물품분(재료비) 집계"
    - "내역서에서 설치분(직접노무비 + 설치 경비) 집계"
    - "설치비중 = 설치분 / 전체 설계금액"
    - "50% 기준 판정 결과 및 적용 계약유형"
  구성:
    - 산정 기준일 및 근거 문서
    - 비목별 금액 및 물품/설치 귀속 구분
    - 비중 계산 내역
    - 판정 결과 및 적용 절차 트랙
    - 판정자 및 검토자
  검증룰: [AUD-039]
  비고: |
    ★ 규정에 정해진 서식이 없다. 프로그램이 새로 만들어 주는 문서.
    감사에서 계약방법 선택의 적정성을 물으면 이 한 장으로 답이 된다.
    구매설치 프로그램에서 가장 먼저 만들 가치가 있는 산출물.

- id: DOC-구매규격서
  명칭: 구매규격서 (물품 규격서)
  format: hwpx
  automation: assist
  태스크: [T-P1-030]
  필수구성:
    - 일반사항
    - "특기시방 (설치 범위·방법·시공 조건)"
    - "제출물 (★ 시험성적서 요건을 4요소로 명시 — AUD-041 참조)"
    - 검사·검수 기준
    - 납품 및 설치 기한
    - 하자보수 조건
    - "부속품·예비품 내역 (★ 부외 예비품 등재 근거)"
  검증룰: [AUD-013, AUD-041]
  비고: "공사의 시방서와 별개 서식. 규격 공개 대상 (감사PPT p.26)"

- id: DOC-원가계산서_구매설치
  명칭: 구매설치 원가계산서 (물품분·설치분 분리)
  format: xlsx
  automation: full
  태스크: [T-P1-030]
  서식출처: "건설사업실 시달 (공사 및 구매설치 원가계산서)"
  룰: [CC-007]
  구조:
    - "물품분 시트: CC-007 물품 열 비목 적용"
    - "설치분 시트: CC-007 공사 열 비목 적용"
    - "종합 시트: 물품분 + 설치분 합산, 부가세·도급액 산출"
  자동계산:
    - "각 분(分)별 제비율 자동 적용 (공사규모·공사기간 기준)"
    - "산업안전보건관리비 대상액 계산 (a방식 또는 b방식 선택 고정)"
    - "소계·합계 재계산 검산"
  검증룰: [AUD-015, AUD-016, AUD-017, AUD-021, AUD-030, AUD-040]
  status: unverified
  비고: |
    ★ 구매설치 프로그램의 핵심 산출물.
    CC-007의 처리방침(물품분·설치분 분리)이 건설사업실에서 확정되어야
    이 서식의 구조가 확정된다. 99_확인필요 최우선 항목.

- id: DOC-조달방식검토
  명칭: 조달 방식 검토보고
  format: hwpx
  automation: assist
  태스크: [T-P1-040]
  룰: [PC-001, PC-002, PC-003]
  구성:
    - "중기간경쟁제품 해당 여부 (SMPP 조회 결과, 세부품명번호)"
    - "추정가격 및 고시금액 대비 판정"
    - "선택한 조달 트랙 및 사유"
    - "예상 소요기간 (조달청 위탁 시 검토기간 포함)"

- id: DOC-계약이행능력심사기준
  명칭: 계약이행능력심사 세부기준
  format: hwpx
  automation: assist
  태스크: [T-P1-160]
  룰: [PC-004]
  검증룰: [AUD-043]
  서식출처: "우리공사 물품구매 적격심사(계약이행능력심사) 세부기준"

- id: DOC-계약이행능력심사결과
  명칭: 계약이행능력심사 결과보고
  format: hwpx
  automation: assist
  태스크: [T-P2-030]

- id: DOC-검사검수자지정
  명칭: 검사·검수자 지정
  format: hwpx
  automation: full
  태스크: [T-P1-160]
  룰: [IN-001, IN-002]
  근거: "물품관리규정 제18조"
  비고: "개별품목 구매단가 1천만원 이상이면 인력Pool 구성 내역 포함"

- id: DOC-제작승인알림
  명칭: 주요기자재 제작 승인 알림
  format: hwpx
  automation: full
  태스크: [T-P3-040]
  첨부: [제작 승인신청서, 제작도면]

- id: DOC-검사조서
  명칭: 검사조서
  format: hwpx
  automation: assist
  태스크: [T-P4-020]
  근거: "물품관리규정 제18조"
  구성: [검사 항목, 규격 대조 결과, 성능 시험 결과, 수량 확인, 검사자, 입회자]
  검증룰: [AUD-045]

- id: DOC-검수조서
  명칭: 검수조서
  format: hwpx
  automation: assist
  태스크: [T-P4-030]
  근거: "물품관리규정 제18조"
  구성: [납품서류상 수량, 실제 수량, 손상·훼손 여부, 인수 확인, 검수자]
  검증룰: [AUD-045]
  비고: "★ 검사조서와 반드시 분리 작성"

- id: DOC-납품기한연장검토
  명칭: 납품기한 연장 검토보고
  format: hwpx
  automation: assist
  태스크: [T-P4-060]
  룰: [DA-008]
  검증룰: [AUD-010]
  구성:
    - 연장 신청 사유 및 귀책 판단
    - 지체상금 부과·면제 검토
    - "일상감사 대상 여부 (★ 납품기한 연장은 일상감사 대상)"
    - 변경 후 납품기한
  비고: "★ 일상감사 미이행 지적 사례에 '물품 납품기한 연장'이 명시되어 있음"

- id: DOC-변경계획보고
  명칭: 계약변경 계획보고
  format: hwpx
  automation: assist
  태스크: [T-P4-070]
  첨부: [시행결의서, 변경내역서]
  검증룰: [AUD-005, AUD-027, AUD-034]

- id: DOC-감독조서
  명칭: 감독조서
  format: hwpx
  automation: assist
  태스크: [T-P5-030]
  비고: "공사의 '공사감독조서'에 대응"

- id: DOC-하자보수보증서접수알림
  명칭: 하자보수보증서 접수 알림
  format: hwpx
  automation: full
  태스크: [T-P6-010]
  비고: "협조전 (계약부서 통보)"
