# =============================================================================
# 05. 서식 (문서 템플릿) 목록
# -----------------------------------------------------------------------------
# 자동화등급(automation)
#   full   : 사업 데이터만으로 완성 가능. 사용자 편집 없이 산출
#   assist : 골격·계산은 자동, 서술 부분은 사용자 입력 필요
#   manual : 프로그램은 체크리스트로만 관리 (업체 징구서류 등)
#
# 형식(format)
#   hwpx : 한글 문서. 결재문서 계열
#          ※ 레거시 .hwp 는 프로그램 생성 불가 → hwpx로 만들고 한글에서 재저장
#   xlsx : 계산이 들어가는 문서. 수식을 살려서 산출
#   pdf  : 최종 배포용 (선택)
#
# 서식출처를 명시한 이유: 감사PPT p.44 "양식 준수" 지적 대응.
# 시달 양식이 바뀌면 프로그램 코드가 아니라 템플릿 파일만 교체하면 되도록 설계한다.
# =============================================================================

schema_version: "kac.doctemplate.v1"

서식관리정책:
  저장위치: "사용자 지정 폴더 (프로그램 내부 하드코딩 금지)"
  버전관리: "서식별 등록일자·출처문서번호를 함께 저장하고, 사업 산출물에 사용된 서식 버전을 기록"
  교체: "사용자가 최신 시달 양식을 등록·교체할 수 있는 UI 필수"
  근거: "감사PPT p.44 — 양식 준수 (건설사업실·인사관리실 시달)"

서식:

# ---------------------------------------------------------------------------
# 설계 단계
# ---------------------------------------------------------------------------
- id: DOC-현장실사조서
  명칭: 현장실사 조서
  format: hwpx
  automation: assist
  태스크: T-S1-010
  비고: "규정상 정형 서식은 없음. 관계부서 의견수렴 결과를 함께 정리"

- id: DOC-수량산출서
  명칭: 수량산출서
  format: xlsx
  automation: assist
  태스크: T-S1-030
  필수요건:
    - "수량산출 근거를 명확히 기재"
    - "가급적 상세하게 객관적으로 산정 (배관·배선, 스위치, 서버 등)"
    - "순서를 내역서 순서와 일치시킴"
  검증룰: [AUD-014]

- id: DOC-단가조사서
  명칭: 단가조사서
  format: xlsx
  automation: assist
  태스크: T-S1-030
  검증룰: [AUD-019]

- id: DOC-일위대가표
  명칭: 일위대가표
  format: xlsx
  automation: assist
  태스크: T-S1-030
  검증룰: [AUD-018, AUD-029]

- id: DOC-원가계산서
  명칭: 공사 및 구매설치 원가계산서
  format: xlsx
  automation: full
  태스크: T-S1-030
  서식출처: "건설사업실 시달"
  자동계산항목:
    - 간접노무비
    - 산재보험료
    - 고용보험료
    - 국민건강보험료
    - 국민연금보험료
    - 노인장기요양보험료
    - 퇴직공제부금비
    - 산업안전보건관리비
    - 기타경비
    - 일반관리비
    - 이윤
    - 부가가치세
  입력필요: [직접재료비, 직접노무비, 기계경비, 가설비, 공사기간, 공사규모]
  비목순서준수: true
  검증룰: [AUD-015, AUD-016, AUD-017, AUD-021, AUD-012, AUD-030]
  비고: "★ 프로그램의 핵심 산출물. 제비율표를 데이터로 참조해 계산"

- id: DOC-내역서
  명칭: 예산내역서 / 물량내역서
  format: xlsx
  automation: assist
  태스크: T-S1-030
  비고: "물량내역서(공내역서 = 단가 미기재)는 설계서에 포함 → 설계변경 사유가 될 수 있음"
  검증룰: [AUD-014, AUD-030]

- id: DOC-시방서
  명칭: 공사시방서 / 규격서 / 과업지시서
  format: hwpx
  automation: assist
  태스크: T-S1-030
  필수기재:
    - "시공범위를 명확하게 표현 (시방서로 표현이 안 될 경우 도면에 상세 표현)"
    - "특정회사 제품 규격을 명기한 경우 그 사유"
    - "할증 적용 사유 (야간·고소·협소 등)"
    - "용역 직접경비 반영 시 실비정산 문구"
  검증룰: [AUD-013, AUD-018, AUD-025]

- id: DOC-설계도면
  명칭: 설계도면
  format: 외부
  automation: manual
  태스크: T-S1-030

- id: DOC-철거발생품예정서
