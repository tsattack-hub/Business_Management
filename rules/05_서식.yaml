징구서류체크리스트:
  - 태스크: T-S2-030
    단계명: 적격심사
    항목: [적격심사 신청서, 자기평가서 및 심사표, 시공실적증명서, 기술자 보유증명서, 경영상태 확인서, 제재처분확인서, 사업자등록증, 정보통신공사업등록증, 법인등기부등본, 법인인감증명서, 퇴직자 재직현황 확인서]
  - 태스크: T-S2-040
    단계명: 계약체결
    항목: [계약보증서, 계약보증금 지급각서, 청렴계약 이행서약서, 퇴직자 재직현황 확인서, 공정거래협약서]
