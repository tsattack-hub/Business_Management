  태스크: T-S1-140
  서식출처: "건설사업실 시달"
  첨부순서:
    - 예산조서
    - 수량조서
    - 지급자재조서
    - "공사원가계산서 및 내역서"
    - 공사시방서
    - 철거발생품 예정서
