# =============================================================================
# 01. 기준금액 (Threshold Rules)
# -----------------------------------------------------------------------------
# 모든 금액은 별도 표기가 없으면 "부가세 제외" 기준.
# 각 룰은 適用[] 배열에 시행일별 버전을 갖는다. 엔진은 사업의 기준일자
# (통상 시행계획 결재일)에 해당하는 버전 중 시행일이 가장 늦은 것을 선택한다.
#
# 상태값(status):
#   confirmed   - 근거 문서로 확정, 그대로 사용 가능
#   unverified  - 근거 문서 간 값이 달라 소관부서 확인 필요 (99_확인필요.md 참조)
#   inferred    - 문서에 직접 명시되지 않아 추론한 값
# =============================================================================

schema_version: "kac.rules.v1"

# -----------------------------------------------------------------------------
# 1. 공통 파라미터 — 여러 룰에서 참조하는 값
# -----------------------------------------------------------------------------
공통파라미터:

  - id: PARAM-고시금액-물품용역
    명칭: 기재부장관 고시금액 (물품·용역)
    설명: WTO 정부조달협정상 개방대상금액. 지역제한·실적제한·조달청 위탁 판단의 기준.
    근거:
      - 국가계약법 제4조 제1항
      - 기획재정부 고시
    status: unverified          # 문서 3종에 2.1억 / 2.2억 / 2.3억 이 혼재
    적용:
      - 시행일: "2016-01-01"
        값: 210000000
        출처: "HWP 사업집행절차 (기재부 고시 2016-34호)"
      - 시행일: null            # ★ 시행일 확인 필요
        값: 220000000
        출처: "감사PPT p.39 — 지역제한 서술"
        비고: "감사PPT는 지역제한을 2.2억, 실적제한을 2.3억으로 달리 표기함"
      - 시행일: null            # ★ 시행일 확인 필요
        값: 230000000
        출처: "감사PPT p.23, p.40 — 실적제한·일반경쟁 서술"

  - id: PARAM-고시금액-공사
    명칭: 기재부장관 고시금액 (공사)
    status: unverified
    적용:
      - 시행일: "2016-01-01"
        값: 8000000000
        출처: "HWP (기재부 고시 2016-34호)"

# -----------------------------------------------------------------------------
# 2. 일상감사 대상 판정
# -----------------------------------------------------------------------------
