# -----------------------------------------------------------------------------
# 3. 계약방법 결정 — 물품 (중기간경쟁제품 아닌 경우)
# -----------------------------------------------------------------------------
# 감사PPT p.23 의사결정도 + p.41 우선조달계약 표를 결합한 룰.
# 엔진은 위에서 아래로 첫 매칭을 채택한다.
# -----------------------------------------------------------------------------
계약방법-물품:
  근거:
    - "계약업무처리지침 제17조의2 (중소기업자와의 우선조달계약)"
    - "판로지원법 시행령 제2조의2"
    - "감사PPT p.23, p.41"
  status: confirmed
  적용시행일: "2025-01-01"
  판정순서:

    - id: CM-P-01
      조건: { 중기간경쟁제품: true, 추정가격: { ">=": 230000000 } }
      결과:
        계약방법: [조달청_위탁, 제한경쟁]
        참가자격: 중기간경쟁제품_직접생산확인
        비고: "공공기관운영법 제44조 제1항 — 고시금액 이상 조달청 위탁"

    - id: CM-P-02
      조건: { 적격심사필요: true, 추정가격: { "<=": 50000000 } }
      결과:
        계약방법: 제한경쟁
        참가자격: [소기업, 소상공인, 창업자, 벤처기업]

    - id: CM-P-03
      조건:
        적격심사필요: false
        추정가격: { ">": 20000000, "<=": 50000000 }
      결과:
        계약방법: 전자공개수의계약
        참가자격: [소기업, 소상공인]

    - id: CM-P-04
      조건: { 적격심사필요: false, 추정가격: { "<": 20000000 } }
      결과:
        계약방법: [전자공개수의계약, 일반수의계약]

    - id: CM-P-05
      조건: { 추정가격: { ">": 50000000, "<": 100000000 } }
      결과:
        계약방법: 제한경쟁
        참가자격: [소기업, 소상공인, 창업자, 벤처기업]
        유찰시_1차: [중소기업_조합제외, 소기업, 소상공인, 벤처기업, 창업자, 중기업]
        유찰시_2차: { 중소기업제한: 불필요, 비고: "우선조달계약 예외" }

    - id: CM-P-06
      조건: { 추정가격: { ">=": 100000000, "<": 230000000 } }
      결과:
        계약방법: 제한경쟁
        참가자격: [중소기업_조합제외, 소기업, 소상공인, 중기업]
        유찰시_1차: { 중소기업제한: 불필요, 비고: "우선조달계약 예외" }

    - id: CM-P-07
      조건: { 추정가격: { ">=": 230000000 } }
      결과:
        계약방법: 일반경쟁입찰
        비고: "실적 등 제한 가능"

  유찰처리주의:
    - "기존 입찰참가자격을 유지(기타 공고내용·조건 포함)하면 '재공고입찰'"
    - "입찰참가자격 등을 변경하면 '새로운 공고'에 해당 — 재공고 아님"

# -----------------------------------------------------------------------------
# 4. 입찰참가자격 제한 룰
# -----------------------------------------------------------------------------
제한경쟁:
  근거:
    - "국가계약법 시행령 제21조"
    - "국가계약법 시행규칙 제25조 제2항, 제5항"
  status: confirmed
  룰:
    - id: RC-001
      명칭: 실적제한 하한
      내용: "고시금액 미만은 실적제한 절대 불가"
      조건: { 추정가격: { "<": 230000000 } }
      결과: { 실적제한: 금지 }
      status: unverified        # 고시금액 값 자체가 미확정

    - id: RC-002
      명칭: 실적제한 배수
      내용: "납품 물품 금액 또는 수량의 1/3이 원칙, 최대 1배수까지"
      결과: { 원칙배수: 0.333, 최대배수: 1.0 }

    - id: RC-003
      명칭: 지역제한
      조건: { 추정가격: { "<": 220000000 } }
      결과:
        제한기준: 본점소재지
        개인사업자: 사업장소재지
        단위: [특별시, 광역시, 특별자치시도]
      status: unverified

    - id: RC-004
      명칭: 중복제한 금지
      내용: |
        같은 항 각 호 또는 각 호 내의 사항을 중복 제한 불가.
        예외 1) 제6호(지역) 제한 시 제2호(실적)와 중복 가능
        예외 2) 제8호(중소기업) 또는 제10호의(소기업등) 제한 시 각 호와 중복 가능
      검증룰: AUD-022

    - id: RC-005
      명칭: 중기간경쟁제품 직접생산확인
      조건: { 추정가격: { ">=": 10000000 } }
      결과:
        제한: 직접생산확인증명서
        비고: "물품분류번호 10자리로 제한. 2개 이상 중기간경쟁제품은 무조건 분리발주"

