        결과: { 대상: true }
        출처: "감사PPT p.5 (2026년 자료 — 현행으로 추정)"
      - 시행일: null
        조건: { 변경금액: { ">=": 20000000 } }
        결과: { 대상: true }
        출처: "공사절차서 3.공사시행 단계"

