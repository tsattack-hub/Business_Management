# =============================================================================
# 08. 감사 검증룰 — 구매설치 전용 추가분 (04_감사검증룰.yaml 에 병합되는 델타)
# -----------------------------------------------------------------------------
# AUD-039 ~ AUD-045. 04 파일의 AUD-001~AUD-038 과 함께 로드한다.
# 구매설치는 04의 룰 중 다음이 그대로 적용된다:
#   AUD-001 002 004 005 006 007 008 009 010 011 012 013 014 015 019
#   AUD-020 021 022 023 024 027 030 031 032 033 034 036 037 038
# 적용되지 않는 것: AUD-026(기술자 배치 — 설치분에만 조건부), AUD-029(일위대가)
# =============================================================================

schema_version: "kac.audit.v1"

검증룰:

- id: AUD-039
  분류: 계약방법
  명칭: 물품·공사 혼합계약 유형 판정 오류
  근거:
    - "(계약예규) 정부 입찰·계약 집행기준 — 물품·공사 등 혼합계약 집행기준"
    - "HWP — 설계금액 50% 기준"
  검증방식: auto
  심각도: blocker
  검증시점: [T-P1-020, T-P1-140]
  판정로직: |
    내역서에서 물품분(재료비)과 설치분(직접노무비 + 설치 경비)을 분리 집계.
    설치비중 = 설치분 / 전체 설계금액
    IF 설치비중 >= 0.50 AND 선택된 계약유형 == 물품제조·구매계약 THEN 차단
    IF 설치비중 <  0.50 AND 선택된 계약유형 == 공사계약        THEN 경고
    어느 경우든 산정 근거표(DOC-계약유형판정근거)를 산출물로 생성
  status: unverified
  지적위험: |
    ★ HWP 기재 실제 사례: "배관/배선공사 50% 이상인데 20%라 한 경우 있음"
    계약방법 선택의 적정성은 일상감사 중점 검토사항(감사기준시행세칙 제44조의2 제7호)이며,
    잘못 판정하면 낙찰기준·검사절차·정산방식이 모두 연쇄적으로 틀린다.
  비고: "50% 경계 근처(45~55%)이면 심각도를 warning으로 낮추고 근거 보강을 요구"

- id: AUD-040
  분류: 원가계산
  명칭: 구매설치 원가계산의 물품·공사 비목 혼용
  근거: "감사PPT p.18 원가계산서 / (계약예규) 예정가격작성기준"
  검증방식: auto
  심각도: error
  검증시점: [T-P1-030]
  판정로직: |
    원가계산서가 물품분·설치분으로 분리 계상되어 있는지 확인.
    분리되어 있지 않은 경우:
      IF 설치 직접노무비 > 0 AND 간접노무비 == 0 → 경고 (설치 노무에 간접노무비 미계상)
      IF 설치 직접노무비 == 0 AND 간접노무비 > 0 → 오류 (순수 물품에 간접노무비 계상)
      IF 설치 직접노무비 == 0 AND 기타경비 > 0   → 오류
    분리되어 있는 경우:
      물품분은 CC-007 물품 열, 설치분은 공사 열 기준으로 각각 검증
  룰참조: [CC-005, CC-007]
  status: unverified
  비고: |
    ★ 구매설치 프로그램의 핵심 검증 로직.
    실무자가 가장 많이 헷갈리고, 감사에서 가장 잘 지적되는 지점.
    CC-007의 구매설치 처리방침이 확정되면 status를 confirmed로 변경.

- id: AUD-041
  분류: 설계
  명칭: 시험성적서 요구사항 불명확
  근거: "구매규격서 특기시방 제출물 조항 / 감사PPT p.32 감사사례"
  검증방식: semi
  심각도: warning
  검증시점: [T-P1-030]
  판정로직: |
    구매규격서 제출물 조항에서 시험성적서 요구 문구를 추출하고
    다음 요소가 명시되어 있는지 확인:
      (1) 시험 항목 및 적용 규격
      (2) 발급기관 요건 (공인기관 / KOLAS 인정기관 등 구체적으로)
      (3) 시험 대상 (★ '납품 장비와 동일 모델·규격'임을 명시)
      (4) 발급 시점 요건 (★ '계약 체결 이후 발급'임을 명시)
    하나라도 빠지면 경고
  설계의도: |
    AUD-002(시험성적서 확인 부적정)는 사후 검사 단계의 룰이다.
    그런데 지적의 근본 원인은 규격서가 애매하게 쓰여 있어서
    업체가 다른 성적서를 내밀 여지를 남긴 것이다.
    → 설계 단계에서 막는 것이 훨씬 효과적이다.
  근거사례: |
    무정전전원공급장치 구매설치 규격서 '2. 특기시방 5. 제출물'은
    공인기관시험성적서 1부 제출을 요구했으나, 제출받은 것은 계약 이전
    NEP 인증용으로 제작사가 한국화학융합시험연구원에 의뢰해 받은 성적서였다.

- id: AUD-042
  분류: 조달
  명칭: 조달청 의뢰 시 설치 비용 누락
  근거: "HWP — 'CCTV 설치 시 단순설치가 아닌 공사·물품 포함 시 설치 노무비, 4대 보험료 등을 규격서·내역서에 포함하여 조달청 의뢰'"
  검증방식: auto
  심각도: error
  검증시점: [T-P2-005]
  판정로직: |
    IF 조달트랙 IN [조달청위탁, 3자단가, MAS] AND 설치작업있음 == true
    THEN 다음이 규격서·내역서에 모두 포함되어 있는지 확인:
         - 설치 직접노무비
         - 4대 보험료 (산재·고용·건강·연금)
         - 노인장기요양보험료
         - 산업안전보건관리비 (총공사금액 4천만원 이상인 경우)
    누락 항목이 있으면 오류
  지적위험: "누락하면 낙찰자가 설치를 이행하지 않거나 추가 정산 분쟁이 발생"

- id: AUD-043
  분류: 계약방법
  명칭: 계약유형과 낙찰기준 불일치
  근거: "우리공사 물품구매·시설공사 적격심사(계약이행능력심사) 세부기준"
  검증방식: auto
  심각도: error
  검증시점: [T-P1-160, T-P2-010]
  판정로직: |
    MX-001 판정 결과와 적용된 낙찰기준을 교차검증.
      계약유형 == 물품제조·구매계약 → 계약이행능력심사 기준 (88점 / 87.99%)
      계약유형 == 공사계약          → 적격심사 기준 (95점 / 87.745%)
    불일치하면 오류.
  status: unverified   # 점수·하한율은 HWP 2016~2017 사례값. 현행 세부기준 확인 필요
  룰참조: [PC-004, MX-001]

- id: AUD-044
  분류: 산업안전보건관리비
  명칭: 구매설치 안전 서류 누락
  근거:
    - "감사PPT p.33 — 산업안전보건관리 정산에 관한 사항(구매설치 포함)"
    - "건설업 산업안전보건관리비 계상 및 사용기준"
    - "산업안전보건법 시행규칙 별지 제102호"
  검증방식: auto
  심각도: error
  검증시점: [T-P3-015, T-P5-030]
  판정로직: |
    IF 총공사금액 >= 40000000 AND 설치작업있음 == true
    THEN 다음 서류의 접수 이력을 확인:
         - 산업안전보건관리비 사용계획서
         - 안전관리계획서
         - 위험성평가 자료
         - 고용·산재보험 가입증명원
    하나라도 없으면 오류
  지적위험: |
    ★ "구매설치니까 공사가 아니다"라고 판단해 안전 서류를 생략하는 오류가 잦다.
    감사 지적 사례의 제목에 '(구매설치 포함)'이 명시되어 있다.
  룰참조: [CC-001]

- id: AUD-045
  분류: 검사
  명칭: 검사와 검수 절차 미분리
  근거: "물품관리규정 제18조, 물품관리지침"
  검증방식: manual
  심각도: warning
  검증시점: [T-P4-020, T-P4-030]
  체크항목:
    - "검사(규격·성능·수량이 취득조건과 일치하는지)를 시행하고 조서를 남겼는가"
    - "검수(손상·훼손 없고 납품서류상 수량대로인지)를 별도로 시행하고 인수했는가"
    - "검사·검수자가 물품관리장(자체취득은 물품운용장)이 지정한 직원인가"
    - "개별품목 구매단가 1천만원 이상이면 검사자 인력Pool로 수행했는가"
  룰참조: [IN-001, IN-002]
