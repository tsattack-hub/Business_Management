# =============================================================================
# 03. 리드타임 및 일정 역산 파라미터
# -----------------------------------------------------------------------------
# 일정 역산 엔진 동작
#   1) 목표 준공일(또는 운영개시일)을 앵커로 잡는다
#   2) 절차템플릿의 선행관계를 역방향(topological reverse)으로 순회
#   3) 각 태스크의 리드타임을 차감 → 태스크별 "최늦 착수일"과 "최늦 완료일" 산출
#   4) 병렬 가능 태스크는 최장 경로(critical path)만 일정에 물린다
#   5) 결과가 오늘보다 과거이면 → 일정 불가 경고 + 단축 가능 구간 제시
#
# 일수 단위(unit)
#   근무일  : 토·일·공휴일 제외. 공휴일은 별도 테이블(공휴일.yaml) 참조
#   달력일  : 자연일
# =============================================================================

schema_version: "kac.leadtime.v1"

기본설정:
  근무일계산: { 주말제외: true, 공휴일테이블: "공휴일.yaml" }
  연말마감:
    id: LT-연말마감
    내용: "계약(납품·준공·완료)기한은 12월 20일 이내로 설정"
    근거: "경영관리실-758(2018-01-26) 발주계획 수립 및 유의사항"
    status: unverified   # 매년 시달되는 지침이므로 당해연도 문서로 갱신 필요
    비고: "연말 적기 대금집행 목적. 역산의 최종 앵커로 사용"
  상반기목표:
    내용: "시설공사는 상반기(1~6월) 발주목표 준수, 발주계획 실적을 매월 조달청 제출"

리드타임:

  # ---------------------------------------------------------------------------
  # 설계·발주 준비 단계
  # ---------------------------------------------------------------------------
  - id: LT-공항시행허가
    태스크: T-S1-020
    일수: 40
    단위: 달력일
    근거: "공항시설법 제6조, 시행규칙 제9조"
    status: confirmed

  - id: LT-공항실시계획
    태스크: T-S1-020
    일수: 40
    단위: 달력일
    근거: "공항시설법 제7조, 시행규칙 제10조"
    status: confirmed

  - id: LT-보안성검토
    태스크: T-S1-040
    일수: null
    단위: 달력일
    status: inferred
    비고: |
      규정상 처리기간 명시 없음. 국정원 협의가 포함되면 수 주 소요.
      ★ 실측 필요 — 프로그램에 과거 사업 실적으로 학습된 기본값을 넣을 것.
      HWP 사례: 보안성검토 요청(9/24) → 시행계획보고 반영(약 2~3주)

  - id: LT-행정예고
    태스크: T-S1-075
    일수: 20
    단위: 달력일
    근거: "개인정보보호법 시행령 제23조, 행정절차법"
    status: confirmed
    비고: "특별한 사정이 없는 한 20일 이상 게시. CCTV 사업 일정의 최대 병목"

  - id: LT-사전규격공개
    태스크: T-S1-090
    일수: 5
    단위: 달력일
    의뢰선행일수: 2
    근거: "구매규격 사전공개제도 운영지침"
    status: unverified   # 의뢰 시점이 2일 전(공사절차서·감사PPT) vs 3일 전(HWP)
    비고: "공개 5일 + 의뢰 리드타임 + 의견 반영 시간까지 확보해야 함"

  - id: LT-소프트웨어과업심의
    태스크: T-S1-060
    일수: null
    단위: 달력일
    status: inferred
    비고: "정기 개최 일정에 종속. 위원회 개최 캘린더를 별도 데이터로 관리 필요"

  - id: LT-일상감사
    태스크: T-S1-110
    일수: 7
    단위: 근무일
    기준: "결재일 또는 시행일"
    방향: 역산
    근거: "감사기준시행세칙 제43조"
    status: confirmed
    비고: |
      ★ 이 값이 프로그램의 핵심. 근무일 7일이므로 공휴일이 끼면 달력상 10~12일.
      감사PPT 기타사항: "근무일 기준 최소 7일 소요됨을 감안하여 사업 발주계획 수립"

  - id: LT-시행계획수립
    태스크: T-S1-140
    일수: 15
    단위: 달력일
    status: inferred
    출처: "HWP — '3.시행계획 수립/시행결의 (~15일)'"

  # ---------------------------------------------------------------------------
  # 입찰·계약 단계
  # ---------------------------------------------------------------------------
  - id: LT-조달청위탁
    태스크: T-P2-005
    일수: null
    단위: 달력일
    status: inferred
    비고: |
      ★ 실측 필요. 규정상 처리기간 없음.
      HWP 기재 문제점: "조달청 의뢰 절차 및 시간 지연"
      조달청 규격 검토기간 + 상호 업무협의 기간 + 나라장터 공고·개찰까지 포함.
      과거 구매설치 사업 5~10건의 (의뢰일 → 계약체결일) 실적으로 기본값 산출 권장.
      MAS 2단계경쟁이면 추가 소요.
    출처: "경영관리실-758(2018-01-26) — 조달청 검토기간 및 업무협의 기간을 고려하여 발주"

  - id: LT-입찰공고
    태스크: T-S2-010
    일수: [4, 7]
    단위: 달력일
    status: confirmed
    비고: "긴급 여부·금액에 따라 상이. 역산 시 보수적으로 7일 사용 권장"

  - id: LT-적격심사
    태스크: T-S2-030
    일수: 7
    단위: 달력일
    조건: "이내"
    status: confirmed

  - id: LT-계약체결
    태스크: T-S2-040
    일수: 10
    단위: 달력일
    기준: "낙찰통지일"
    조건: "이내"
    status: confirmed
    비고: "계약일을 통상 착공일로 봄"

  - id: LT-착공신고
    태스크: T-S3-030
    일수: 14
    단위: 달력일
    기준: 계약일
    조건: "이내"
    status: confirmed
    비고: "실무상 3~4일 내 제출. 착공일은 계약일과 같을 수도, 늦을 수도 있음"

  - id: LT-재해예방기술지도계약
    태스크: T-S3-010
    기한: "착공일 전날"
    단위: 달력일
    status: confirmed
    유형: 절대기한   # 리드타임이 아니라 하드 데드라인

  # ---------------------------------------------------------------------------
  # 준공·하자 단계
  # ---------------------------------------------------------------------------
  - id: LT-준공검사
    태스크: T-S5-030
    일수: 14
    단위: 달력일
    기준: "준공조사 요청일"
    조건: "이내"
    근거: "국가계약법 시행령 제55조"
    status: confirmed

  - id: LT-공항준공확인
    태스크: T-S5-030
    일수: 60
    자체검사일수: [14, 7]
    단위: 달력일
    근거: "공항시설법 제20조·제25조, 시행규칙 제14조"
    activate_if: { 공항개발사업해당: true }
    status: confirmed

  - id: LT-AIP_SUP
    태스크: T-S1-020
    일수: 60
    단위: 달력일
    사전신청: true
    근거: "항공안전법 제89조"
    status: confirmed
    비고: "기간 3월 이상인 경우. 3개월 이하는 NOTAM"

  - id: LT-AIP_AMDT
    태스크: T-S5-090
    일수: 20
    단위: 달력일
    사전신청: true
    근거: "항공안전법 제89조"
    status: confirmed

  - id: LT-최종하자검사
    태스크: T-S6-030
    기한: "하자담보책임기간 만료 14일 전"
    유형: 절대기한
    status: confirmed

