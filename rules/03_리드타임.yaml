  - { id: PR-003, 태스크: T-S4-090, 주기: 월1회, 기한: "다음달 5일", 명칭: 공정보고 }
  - { id: PR-004, 태스크: T-S3-080, 주기: 연2회, 최초기한: "착공 후 15일", 명칭: 청렴·반부패 교육 }
  - { id: PR-005, 태스크: T-S6-020, 주기: 연2회, 관행시점: ["4월", "9월"], 명칭: 정기 하자검사 }
  - { id: PR-006, 태스크: T-S4-010, 주기: 상시, 명칭: 공사작업일지 }

# -----------------------------------------------------------------------------
# 역산 예시 (검증용 시나리오)
# -----------------------------------------------------------------------------
# 프로그램 개발 시 이 시나리오로 엔진 출력을 검증할 것.
# -----------------------------------------------------------------------------
검증시나리오:
  - 명칭: "CCTV 설치 정보통신공사 (추정가격 2.8억, 관급자재 있음)"
    입력:
      목표준공일: "2026-12-20"
      사업유형: 정보통신공사
      추정가격: 280000000
      CCTV설치: true
      관급자재있음: true
      공사기간일: 90
    기대되는_역산경로:
      - { 태스크: T-S5-030, 소요: 14, 설명: 준공검사 }
      - { 태스크: 공사수행, 소요: 90, 설명: 계약상 공사기간 }
      - { 태스크: T-S3-030, 소요: 4, 설명: 착공계 }
      - { 태스크: T-S2-040, 소요: 10, 설명: 계약체결 }
      - { 태스크: T-S2-030, 소요: 7, 설명: 적격심사 }
      - { 태스크: T-S2-010, 소요: 7, 설명: 입찰공고 }
      - { 태스크: T-S1-150, 소요: 3, 설명: 계약의뢰 }
      - { 태스크: T-S1-140, 소요: 15, 설명: 시행계획 수립 }
      - { 태스크: T-S1-110, 소요: "근무일 7", 설명: 일상감사 }
      - { 태스크: T-S1-090, 소요: 7, 설명: "사전규격공개 5일 + 의뢰 2일" }
      - { 태스크: T-S1-075, 소요: 20, 설명: "행정예고 (T-S1-090과 병렬 가능)" }
      - { 태스크: T-S1-040, 소요: "실측값", 설명: "보안성검토 (병렬 가능)" }
      - { 태스크: T-S1-030, 소요: "실측값", 설명: 설계서 작성 }
    확인포인트:
      - "행정예고 20일과 사전규격공개 7일이 병렬로 처리되는지"
      - "일상감사 7근무일이 공휴일을 반영해 달력일로 환산되는지"
      - "관급자재 구매 트랙의 납품일이 본 공사 공정에 물리는지"
      - "역산 결과 설계 착수일이 과거이면 경고를 띄우는지"
