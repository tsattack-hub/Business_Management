# =============================================================================
# 06. 절차 템플릿 — 구매설치 (물품 + 설치 혼합)
# -----------------------------------------------------------------------------
# ★ 이 템플릿을 쓸 수 있는지부터 판정해야 한다.
#    설계금액 중 설치(공사) 비중이 50% 이상이면 '공사계약'이므로
#    02_절차템플릿_정보통신공사.yaml 로 넘어간다. (룰 MX-001)
#
# 공사 템플릿(02)과 다른 점 요약
#   · 시방서 → 구매규격서
#   · 적격심사 → 계약이행능력심사 (종합평점·낙찰하한율이 다름)
#   · 착공계·시공계획서 없음, 대신 납품계획·설치계획
#   · 준공검사 → 검사·검수 (물품관리규정 제18조) + 설치분 준공검사
#   · 하자담보책임기간이 정보통신공사업법 시행령 제37조 대상이 아님 → 계약조건 적용
#   · 조달청 위탁 / 3자단가 / MAS 트랙이 추가로 존재
#
# 공사 템플릿과 같은 점 (놓치기 쉬움)
#   · 구매규격 사전공개 대상 (금액 무관)
#   · 일상감사 대상 (추정가격 1억원 초과)
#   · 보험료·산업안전보건관리비 정산 대상  ← 감사 지적 빈발
#   · 시험성적서 확인 의무
# =============================================================================

schema_version: "kac.procedure.v1"
사업유형: 구매설치
상속: 02_절차템플릿_정보통신공사.yaml
근거문서: [감사사례 공유 및 토의, "HWP 사업집행 및 계획시 관리절차", 공사절차서]

# -----------------------------------------------------------------------------
# 진입 판정 — 이 사업이 구매설치(물품)인지 공사인지
# -----------------------------------------------------------------------------
진입판정:
  룰: MX-001
  설명: |
    설계금액을 물품 부분과 설치(공사) 부분으로 분리해 비중을 계산한다.
      설치비중 >= 50%  →  공사(용역)계약  → 02 템플릿
      설치비중 <  50%  →  물품제조·구매계약 → 이 템플릿
  주의: |
    ★ HWP 사례에 실제 문제 기록이 있음:
      "배관/배선공사 : 50% 이상 공사인데 20%라고 한 경우 있음"
    비중 산정 근거(수량산출서 기준 물품가 vs 설치 노무비·경비)를
    문서로 남기지 않으면 감사에서 다툼이 된다. 프로그램은 이 계산을
    자동으로 하고 근거표를 산출물로 만들어야 한다.
  산출물: [DOC-계약유형판정근거]
  검증룰: [AUD-039]

단계:

# =============================================================================
- 단계id: P1
  명칭: 설계 (규격 작성)
  태스크:

    - id: T-P1-010
      명칭: 현장실사 및 소요 파악
      산출물: [DOC-현장실사조서]

    - id: T-P1-020
      명칭: 물품·설치 범위 확정 및 계약유형 판정
      선행: [T-P1-010]
      룰: [MX-001]
      산출물: [DOC-계약유형판정근거]
      검증룰: [AUD-039]
      비고: "이 태스크의 결과가 이후 전체 절차를 결정. 프로그램의 첫 분기점"

    - id: T-P1-030
      명칭: 구매규격서 작성
      선행: [T-P1-020]
      산출물: [DOC-구매규격서, DOC-수량산출서, DOC-단가조사서, DOC-원가계산서_구매설치, DOC-내역서]
      규격서필수구성:
        - 일반사항
        - "특기시방 (설치 범위·방법)"
        - "제출물 (★ 공인기관시험성적서 등 — 요구 시점과 발급기관을 명확히)"
        - 검사·검수 기준
        - 납품 및 설치 기한
        - 하자보수 조건
      검증룰:
        - AUD-013   # 특정회사 규격 명기
        - AUD-014   # 수량산출서 ↔ 내역서 불일치
        - AUD-015   # 제비율 최신본 미적용
        - AUD-021   # 물품에 간접노무비·기타경비 적용
        - AUD-030   # 소계·합계 검산
        - AUD-040   # 구매설치 원가계산 열 혼용
        - AUD-041   # 시험성적서 요구사항 불명확
      주의: |
        ★ 구매설치 원가계산의 최대 함정
        순수 물품은 간접재료비·간접노무비·기타경비를 적용하지 않는다(CC-005).
        그런데 구매설치는 설치 노무비와 4대 보험료·산업안전보건관리비가 들어간다.
        HWP: "단순설치가 아닌 공사·물품 포함 시 설치 노무비, 4대 보험료 등을
              규격서·내역서에 포함하여 조달청 의뢰"
        → 물품분과 설치분을 원가계산서에서 분리하고, 각각 맞는 제비율을 적용해야 함

    - id: T-P1-035
      명칭: 중기간경쟁제품 해당 여부 확인
      선행: [T-P1-020]
      룰: [PC-001]
      확인방법: "SMPP(중소기업제품 공공구매 종합정보망)에서 세부품명번호로 확인, 필요시 중기부 유선 확인"
      결과: "해당하면 조달 트랙 판정(T-P1-040)에 반영"
      비고: "예) 영상감시장치 — 제품군 폐쇄회로·텔레비전시스템, 세부품명번호 4617162201"

    - id: T-P1-040
      명칭: 조달 트랙 판정 (자체입찰 / 조달청 위탁 / 3자단가·MAS)
      선행: [T-P1-035]
      룰: [PC-001, PC-002, PC-003]
      산출물: [DOC-조달방식검토]
      주의: |
        조달청 위탁으로 결정되면 조달청 검토기간과 업무협의 기간이 추가된다.
        HWP 기재 문제점: "조달청 의뢰 절차 및 시간 지연"
        → 일정 역산에 LT-조달청위탁을 반드시 반영

    - id: T-P1-050
      명칭: 공사용 자재 직접구매(분리발주) 판정
      선행: [T-P1-020]
      룰: [DP-001, DP-002, DP-003, DP-004, DP-005]
      검증룰: [AUD-024]
      주의: |
        ★ 구매설치에서 특히 중요.
        정보통신공사 3억원 이상 + 대상품목 4천만원 이상이면
        해당 품목을 관급자재로 설계에 반영해 직접구매해야 한다.
        HWP 기재: 이 기준을 회피하려고 발주 방식을 조정한 민원 사례 발생.
        2개 이상 중기간경쟁제품은 무조건 분리발주.

    - id: T-P1-060
      명칭: 보안성 검토 요청
      선행: [T-P1-030]
      activate_if:
        or:
          - { 시설물신축_증개축: true }
          - { 정보통신제품도입: true }   # L3·라우터 등 네트워크장비
      근거:
        - "보안업무규정 제137조 (별지 제56호)"
        - "경영관리실-1298(2018-02-14) — 정보통신제품 도입 시 보안성 적합성 검증"
      비고: "정보시스템·정보통신제품 도입은 사이버보안팀 협조 (보안성 적합성 검증)"

    - id: T-P1-065
      명칭: 정보화사업 보안성 검토
      선행: [T-P1-030]
      activate_if: { 정보화사업: true }
      시점: "계획단계 (입찰공고 전)"
      근거: "정보보안업무세부지침 제15조·제19조"

    - id: T-P1-070
      명칭: TTA 인증제품 확인
      선행: [T-P1-030]
      activate_if: { 품목: [CCTV, IP카메라, NVR] }
      근거: "항행시설실-657(2018-02-07)"
      요구사항: "공공기관용 보안성능품질 TTA Verified 인증제품 도입"
      status: unverified
      비고: "인증 버전(Ver.1)이 갱신되었을 가능성 — 현행 요구 버전 확인 필요"

    - id: T-P1-075
      명칭: 행정예고 (영상정보처리기기)
      선행: [T-P1-030]
      activate_if: { CCTV설치: true }
      리드타임: [LT-행정예고]
      근거: "개인정보보호법 제25조 제1항, 시행령 제23조"

    - id: T-P1-080
      명칭: 우선구매 대상 검토
      선행: [T-P1-030]
      시점: "발주 전 (시행방침 수립 전)"
      근거: "계약업무처리지침 제10조"
      검토대상: [중소기업제품, 기술개발제품, 여성기업제품, 사회적기업, 중증장애인 직접생산제품, 장애인표준사업장제품, 장애인기업제품]

    - id: T-P1-085
      명칭: 소프트웨어사업 과업심의위원회
      선행: [T-P1-030]
      activate_if: { 소프트웨어포함: true }
      시점: "사전규격공개 전"
      근거: "소프트웨어진흥법 제50조"

    - id: T-P1-087
      명칭: 방송장비 규격서 심의위원회
      선행: [T-P1-030]
      activate_if: { 방송장비: true, 추정가격: { ">=": 100000000 } }
      근거: "공공기관 방송장비 구축운영 지침 제3조~제5조"

    - id: T-P1-090
      명칭: 구매규격 사전공개 의뢰
      선행: [T-P1-030, T-P1-085]
      activate_if: { always: true }        # ★ 구매설치는 금액 무관 전건 대상
      시점: "★ 일상감사 의뢰 이전 (시행방침 결정 이전)"
      리드타임: [LT-사전규격공개]
      근거:
        - "계약업무처리지침 제11조"
        - "구매규격 사전공개제도 운영지침 제2조·제4조"
        - "감사PPT p.26 — 용역 및 구매설치의 경우 규격 공개 시행"
      제출자료: [구매규격 사전공개의뢰서, 구매규격서]
      후속: "접수된 외부 의견을 반영해 규격서·시행계획서 수정"
      예외:
        - "공사에서 지정한 규격서가 없는 조달구매 또는 분기자재"
        - "해당연도에 1회 이상 공개 실적이 있는 물품"
      검증룰: [AUD-036]
      주의: "★ 공사와 달리 금액 하한이 없다. 소액이라 생략했다가 지적되는 사례 주의"

    - id: T-P1-100
      명칭: 일상감사 대상 판정
      선행: [T-P1-030]
      룰: [DA-008, DA-011]
      기준: "추정가격 1억원 초과 (재고자산 제외) / 수의계약·지명입찰은 2천만원 이상"

    - id: T-P1-110
      명칭: 일상감사 의뢰
      선행: [T-P1-090, T-P1-100, T-P1-060]
      activate_if: { 일상감사대상: true }
      리드타임: [LT-일상감사]
      상속: T-S1-110      # 상신방법·결재선·중점검토사항은 공사와 동일
      검증룰: [AUD-001, AUD-010, AUD-033, AUD-036]

    - id: T-P1-130
      명칭: 계약심의위원회 심의
      선행: [T-P1-030]
      activate_if:
        or:
          - { 계약방법: 수의계약, 추정가격: { ">=": 10000000 } }
          - { 낙찰방법: [2단계경쟁, 협상에의한계약] }
      시점: "시행방침 이전"
      근거: "계약심의위원회 운영지침 제3조 제1항 제4호, 계약업무처리지침 제13조 제3항"

    - id: T-P1-140
      명칭: 시행계획 수립 및 시행결의
      선행: [T-P1-110, T-P1-130]
      산출물: [DOC-시행계획보고, DOC-시행결의서]
      시행결의서_첨부:
        - 예산조서
        - 수량조서
        - "원가계산서 및 내역서"
        - 구매규격서
        - "설치 위치도 / 시스템 구성도"
        - 계약유형 판정근거
        - 보안성검토 결과
      검증룰: [AUD-038]

    - id: T-P1-150
      명칭: 계약의뢰
      선행: [T-P1-140]
      산출물: [DOC-계약의뢰서]
      첨부세트: [계약요청서, 시행계획보고, 시행결의서, 원가계산서, 내역서, 구매규격서, 계약이행능력심사기준, 셀프체크리스트]
      검증룰: [AUD-020]

    - id: T-P1-160
      명칭: 계약이행능력심사 기준 수립 및 검사자 지정
      선행: [T-P1-140]
      산출물: [DOC-계약이행능력심사기준, DOC-검사검수자지정]
      룰: [PC-004, IN-002]
      근거: "물품관리규정 제18조, 물품관리지침"
      비고: "개별품목 구매단가 1천만원 이상이면 납품물품 검사자 인력Pool 구성 (IN-002)"

# =============================================================================
- 단계id: P2
  명칭: 입찰 및 계약
  태스크:

    - id: T-P2-005
      명칭: 조달청 구매 의뢰
      선행: [T-P1-150]
      activate_if: { 조달트랙: [조달청위탁, 3자단가, MAS] }
      리드타임: [LT-조달청위탁]
      제출자료: [구매규격서, 원가계산서, 내역서, 수량산출서]
      주의: |
        ★ CCTV 등 설치가 포함된 물품을 조달청에 의뢰할 때는
        단순 납품이 아니므로 설치 인건비·4대 보험료를 규격서·내역서에 포함해야 한다.
        누락하면 낙찰자가 설치를 이행하지 않거나 추가 정산 분쟁이 발생.
      검증룰: [AUD-042]

    - id: T-P2-010
      명칭: 입찰공고
      선행: [T-P1-150, T-P1-160]
      activate_if: { 조달트랙: 자체입찰 }
      리드타임: [LT-입찰공고]
      공고첨부:
        - 입찰공고서
        - 계약이행능력심사 세부기준
        - 구매규격서
        - 내역서
        - "청렴계약 이행서약서(업체용)"
        - 퇴직자 재직현황 확인서
      참가자격구성:
